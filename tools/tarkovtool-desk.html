<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk — Tarkov Tools</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Desk", "description": "Мини-вкладки: несколько инструментов сразу поверх общего состояния."}
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; padding: 0 !important; }
    .desk-top {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      background: var(--card); flex-wrap: wrap;
    }
    .desk-brand { font-weight: 800; color: var(--accent); margin-right: 8px; white-space: nowrap; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); cursor: pointer;
      font-size: .85rem; max-width: 180px;
    }
    .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(201,162,39,.1); }
    .tab .x { opacity: .5; font-size: .9rem; padding: 0 2px; }
    .tab .x:hover { opacity: 1; color: var(--red); }
    .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .desk-actions { display: flex; gap: 6px; align-items: center; }
    .notif-btn { position: relative; }
    .notif-btn .badge {
      position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff;
      font-size: .65rem; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center;
    }
    .desk-body { flex: 1; min-height: 0; position: relative; background: var(--bg); }
    .desk-body iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: var(--bg); display: none;
    }
    .desk-body iframe.active { display: block; }
    .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-direction: column; gap: 12px; padding: 24px; text-align: center;
    }
    .picker {
      display: none; position: absolute; z-index: 50; top: 48px; right: 12px;
      width: min(360px, 92vw); max-height: 60vh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4); padding: 10px;
    }
    .picker.open { display: block; }
    .picker input { width: 100%; margin-bottom: 8px; }
    .picker a {
      display: block; padding: 8px 10px; border-radius: 8px; color: var(--text);
      text-decoration: none; font-size: .9rem;
    }
    .picker a:hover { background: rgba(201,162,39,.12); }
    .notif-panel {
      display: none; position: absolute; z-index: 50; top: 48px; right: 12px;
      width: min(380px, 92vw); max-height: 55vh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4); padding: 10px;
    }
    .notif-panel.open { display: block; }
    .notif-item {
      padding: 10px; border-bottom: 1px solid var(--border); font-size: .88rem;
      cursor: pointer;
    }
    .notif-item.unread { background: rgba(201,162,39,.06); }
    .notif-item .t { font-weight: 700; color: var(--accent); }
    .notif-item .m { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="desk-top">
    <a class="desk-brand" href="tarkovtool-hub.html">Tarkov Tools</a>
    <div class="tabs" id="tabs"></div>
    <div class="desk-actions">
      <button type="button" class="btn-ghost" id="addBtn">+ вкладка</button>
      <button type="button" class="btn-ghost notif-btn" id="notifBtn" title="Уведомления">🔔<span class="badge" id="badge" style="display:none">0</span></button>
      <a class="btn-ghost" href="tarkovtool-my-tarkov.html" target="_blank" style="text-decoration:none">My Tarkov</a>
    </div>
  </div>
  <div class="desk-body" id="body">
    <div class="empty" id="empty">
      <div style="font-size:1.2rem;font-weight:700">Desk</div>
      <div>Открой несколько инструментов мини-вкладками. Каждый остаётся отдельной страницей.</div>
      <button type="button" class="btn" id="emptyAdd">Добавить вкладку</button>
    </div>
  </div>
  <div class="picker" id="picker">
    <input type="search" id="pq" placeholder="Поиск инструмента…">
    <div id="plist"></div>
  </div>
  <div class="notif-panel" id="npanel">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <strong>Уведомления</strong>
      <button type="button" class="btn-ghost" id="clearN" style="min-height:28px!important;min-width:auto!important">очистить</button>
    </div>
    <div id="nlist"></div>
  </div>

  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
    <script src="tarkovtool-desk.js"></script>
</body>
</html>
