<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профит за слот — Tarkov</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <link rel="stylesheet" href="../core/tarkov-ui.css?v=3">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Лут ₽/слот", "description": "Цена за клетку: flea и торговец, пометка квеста."}
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1600px,92vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .card-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .field{flex:1;min-width:160px}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    select,input,textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;font-size:1rem;width:100%}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.45}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
    .status{font-size:.95rem;color:var(--muted);margin-top:8px}
    .status.ok{color:var(--green)}.status.err{color:var(--red)}
    .tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:4px;margin:2px;background:rgba(255,255,255,.06);color:var(--muted)}
    .tag.good{background:rgba(61,214,140,.15);color:var(--green)}
    .tag.bad{background:rgba(240,113,120,.15);color:var(--red)}
    .tag.quest{background:rgba(201,162,39,.2);color:var(--accent)}
    .tag.trader{background:rgba(100,160,255,.15);color:#7ec8ff}
    .name-cell{display:flex;align-items:center;gap:10px}
    .ico{width:48px;height:48px;object-fit:contain;border-radius:6px;background:#0a0c10}
    .name{font-weight:600}.meta{font-size:.82rem;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:55vh}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
    th{color:var(--muted);font-size:.75rem;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
    .suggest{position:absolute;z-index:20;background:var(--card);border:1px solid var(--border);border-radius:8px;max-height:240px;overflow:auto;width:min(480px,90vw)}
    .suggest div{padding:8px 12px;cursor:pointer}
    .suggest div:hover{background:rgba(201,162,39,.12)}
    .hint{font-size:.85rem;color:var(--muted);margin-top:10px}
    .field{position:relative}
  </style>
</head>
<body>
  <div class="container">
    <h1>Профит лута · ₽ / слот</h1>
    <p class="sub">Быстро: flea и скупщик за клетку + нужен ли для квеста</p>
    <div class="card">
      <div class="row">
        <div class="field"><label>Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <button type="button" class="btn" id="loadBtn">ЗАГРУЗИТЬ</button>
      </div>
      <p class="status" id="status"></p>
    </div>
    <div class="card" id="ui" style="display:none">
      <div class="field">
        <label>Предмет</label>
        <input type="text" id="q" placeholder="gpu, toothpast, LEDX…" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <div id="out" style="margin-top:14px"></div>
      <p class="hint">Можно вводить несколько через запятую — таблица сравнения.</p>
    </div>
  </div>

  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-loot-slot.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
