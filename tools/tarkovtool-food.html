<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <title>Еда и вода — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-food.html","title":"Еда и вода","description":"Пища / вода: energy, hydration, цена, рейтинг ₽/очко.","file":"tarkovtool-food.html"}
  </script>
  <style>
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .chip { background:var(--input-bg); border:1px solid var(--border); border-radius:16px; padding:6px 14px; font-size:.85rem; color:var(--muted); cursor:pointer; }
    .chip.active { border-color:var(--accent); color:var(--accent); }
    .name-cell { display:flex; align-items:center; gap:10px; }
    .ico { width:40px; height:40px; object-fit:contain; border-radius:6px; background:var(--input-bg); }
    .score { font-weight:800; color:var(--accent); }
    th { cursor:pointer; user-select:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Еда и вода</h1>
    <p class="sub">Питательная ценность, доступность и цена за восстановление</p>
    <div class="card">
      <div class="card-title" data-i18n="tool.itemScore.filter">Фильтр</div>
      <div class="chips" id="kindChips">
        <button type="button" class="chip active" data-k="all" data-i18n="tool.food.ui.kind.all">Всё</button>
        <button type="button" class="chip" data-k="food" data-i18n="tool.food.ui.kind.food">Только пища</button>
        <button type="button" class="chip" data-k="drink" data-i18n="tool.food.ui.kind.drink">Только вода</button>
      </div>
      <div class="row">
        <div class="field" style="max-width:160px">
          <label data-i18n="tool.itemScore.gameMode">Режим</label>
          <select id="gameMode">
            <option value="pve" selected>pve</option>
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
          </select>
        </div>
        <div class="field" style="max-width:200px">
          <label data-i18n="tool.itemScore.search">Поиск</label>
          <input type="search" id="q" data-i18n-placeholder="tool.itemScore.searchPlaceholder" placeholder="имя…">
        </div>
        <button type="button" class="btn" id="btnLoad" data-i18n="tool.itemScore.load">Загрузить</button>
      </div>
      <p class="status" id="status" data-i18n="tool.food.ui.loadPrompt">Нажми «Загрузить»</p>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-s="name" data-i18n="tool.itemScore.name">Предмет</th>
              <th data-s="kind" data-i18n="tool.itemScore.type">Тип</th>
              <th data-s="energy" data-i18n="tool.food.ui.energy">Energy</th>
              <th data-s="hydration" data-i18n="tool.food.ui.hydration">Hydration</th>
              <th data-s="units" data-i18n="tool.food.ui.units">Units</th>
              <th data-s="avg" data-i18n="tool.itemScore.price">Цена ₽</th>
              <th data-s="perPoint" data-i18n="tool.food.ui.pricePerPoint">Цена / очко</th>
              <th data-s="score" data-i18n="tool.itemScore.score">Рейтинг</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="../core/tarkov-dicts.js"></script>
  <script type="module" src="../core/tarkov-names.js"></script>
  <script type="module" src="../core/tarkov-storage.js"></script>
  <script type="module" src="../core/tarkov-api.js"></script>
  <script type="module" src="../core/tarkov-item-domain.js"></script>
  <script type="module" src="../core/tarkov-item-view-models.js"></script>
  <script type="module" src="../core/tarkov-ui.js"></script>
  <script type="module" src="../core/tarkov-state.js"></script>
  <script type="module" src="../core/tarkov-common.js"></script>
  <script type="module" src="../js/food.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
