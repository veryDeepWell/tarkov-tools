<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Локализатор — Tarkov Tools</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title":"Локализатор","description":"Поиск предметов и квестов по именам в выбранных языках API."}
  </script>
  <style>
    .container { max-width: min(1600px, 96vw); margin: 0 auto; padding: 12px 14px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field { flex: 1; min-width: 140px; }
    .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .lang-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
    .lang-chip {
      display: inline-flex !important; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); cursor: pointer;
      font-size: .9rem; font-weight: 600; user-select: none;
      min-width: 0 !important; min-height: 36px !important;
    }
    .lang-chip input[type=checkbox] {
      width: 16px !important; height: 16px !important; min-width: 16px !important;
      min-height: 16px !important; margin: 0 !important; accent-color: var(--accent);
      flex-shrink: 0;
    }
    .lang-chip.on { border-color: var(--accent); color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 14px; color: var(--muted); cursor: pointer; font-weight: 600;
      min-width: auto !important;
    }
    .tab.active { border-color: var(--accent); color: var(--accent); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th { position: sticky; top: 0; background: var(--input-bg); text-align: left; padding: 10px 12px;
      color: var(--muted); font-size: .8rem; text-transform: uppercase; z-index: 1; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
    .ico { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: #0003; }
    .nm { font-weight: 600; }
    .sh { font-size: .85rem; color: var(--muted); }
    .mark { background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 3px; padding: 0 2px; }
    .copy-btn {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: .75rem; color: var(--muted); cursor: pointer; margin: 2px;
      min-width: auto !important;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .status { font-size: .9rem; color: var(--muted); margin-top: 10px; }
    .status.ok { color: var(--green, #3dd68c); }
    .status.err { color: var(--red, #f87171); }
    .meta { font-size: .8rem; color: var(--muted); }
    .btn { background: var(--accent); color: #111; border: none; border-radius: 8px;
      padding: 10px 16px; font-weight: 700; cursor: pointer; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost {
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--muted); cursor: pointer; font-weight: 600;
    }
    select, input[type=search] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; color: var(--text); outline: none; font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="font-size:1.35rem;margin:0 0 4px">Локализатор</h1>
    <p class="meta" style="margin-bottom:12px">1) Languages  2) Load  3) Search. Nothing heavy downloads before Load.</p>

    <div class="card">
      <div class="card-title">Languages (max 4)</div>
      <div class="lang-grid" id="langGrid">
        <label class="lang-chip on"><input type="checkbox" data-code="en" checked><span>English (en)</span></label>
        <label class="lang-chip on"><input type="checkbox" data-code="ru" checked><span>Russian (ru)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="uk"><span>Ukrainian (uk)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="de"><span>Deutsch (de)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="fr"><span>Francais (fr)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="es"><span>Espanol (es)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="pl"><span>Polski (pl)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="cs"><span>Cestina (cs)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="it"><span>Italiano (it)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="pt"><span>Portugues (pt)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="tr"><span>Turkce (tr)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="zh"><span>Chinese (zh)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="ja"><span>Japanese (ja)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="ko"><span>Korean (ko)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="hu"><span>Magyar (hu)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="ro"><span>Romana (ro)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="sk"><span>Slovak (sk)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="th"><span>Thai (th)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="id"><span>Indonesia (id)</span></label>
        <label class="lang-chip"><input type="checkbox" data-code="vn"><span>Vietnamese (vn)</span></label>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="field" style="flex:0;min-width:140px">
          <label>Mode</label>
          <select id="gameMode">
            <option value="pve" selected>pve</option>
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
          </select>
        </div>
        <button type="button" class="btn" id="loadBtn">Load</button>
        <button type="button" class="btn-ghost" id="selDefault" style="min-width:auto">en + ru</button>
        <button type="button" class="btn-ghost" id="selNone" style="min-width:auto">en only</button>
      </div>
      <p class="status" id="status">Check languages, then Load</p>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="items">Items</button>
      <button type="button" class="tab" data-tab="quests">Quests</button>
    </div>

    <div class="card" id="searchCard" hidden>
      <div class="field">
        <label>Search</label>
        <input type="search" id="q" placeholder="m4a1 / bolt / ..." autocomplete="off">
      </div>
      <p class="meta" id="count" style="margin-top:8px"></p>
    </div>

    <div class="card" id="tableCard" hidden>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../core/tarkov-common.js"></script>
  <script src="tarkov-localizer.js"></script>
</body>
</html>
