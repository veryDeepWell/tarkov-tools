<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скиллы · чизы — Tarkov</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <link rel="stylesheet" href="../core/tarkov-ui.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Скиллы + чизы", "description": "Уровень и способ быстрой прокачки каждого навыка."}
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1100px, 94vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
    .skill-row{display:grid;grid-template-columns:150px 64px 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border)}
    .skill-row:last-child{border-bottom:none}
    @media(max-width:700px){.skill-row{grid-template-columns:1fr}}
    .skill-row input[type=number]{width:60px;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text)}
    .name{font-weight:700;font-size:1rem}
    .tag{display:inline-block;font-size:.68rem;padding:2px 6px;border-radius:4px;margin-top:4px;background:rgba(255,255,255,.06);color:var(--muted)}
    .tag.phys{background:rgba(61,214,140,.12);color:var(--green)}
    .tag.prac{background:rgba(100,160,255,.12);color:#7ec8ff}
    .tag.combat{background:rgba(240,113,120,.12);color:var(--red)}
    .tag.mental{background:rgba(201,162,39,.15);color:var(--accent)}
    .how{font-size:.9rem;color:var(--text);line-height:1.45}
    .how b{color:var(--accent)}
    .soft{font-size:.8rem;color:var(--muted);margin-top:4px}
    h1{margin-bottom:6px}
    .sub{color:var(--muted);margin-bottom:14px;font-size:.92rem}
    .meta{font-size:.75rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <h1>Скиллы</h1>
    <p class="sub">Уровень + как качать быстро. Усталость: 129% → 100% → 60% → 36%… сброс ~200 с без прогресса. Elite 51.</p>

    <div class="card">
      <div id="skillList"></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn" id="saveSkills">Сохранить</button>
        <button type="button" class="btn-ghost" id="resetSkills">Сбросить уровни</button>
      </div>
    </div>
  </div>

  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-skills.js?v=12"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
