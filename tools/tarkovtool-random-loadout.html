<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <title>Рандомный лоадаут — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-random-loadout.html","title":"Рандомный лоадаут","description":"Случайный ган без модов — раскладка как на персонаже.","file":"tarkovtool-random-loadout.html"}
  </script>
  <style>
    .paperdoll { display:grid; grid-template-columns:1fr 1.2fr 1fr; grid-template-rows:auto auto auto auto auto; gap:10px; max-width:720px; margin:0 auto; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; }
    .pd-slot { background:var(--input-bg); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
    .pd-slot .lab { font-size:.65rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .pd-slot img { width:56px; height:56px; object-fit:contain; border-radius:6px; background:var(--bg); }
    .pd-slot .nm { font-weight:700; font-size:.88rem; line-height:1.2; }
    .pd-slot .pr { color:var(--accent); font-size:.82rem; font-variant-numeric:tabular-nums; }
    .pd-slot.empty { opacity:.55; border-style:dashed; }
    .pd-helmet { grid-column:2; grid-row:1; }
    .pd-headset { grid-column:1; grid-row:1; }
    .pd-glasses { grid-column:3; grid-row:1; }
    .pd-gun { grid-column:1; grid-row:2 / 4; min-height:140px; }
    .pd-armor { grid-column:2; grid-row:2; }
    .pd-rig { grid-column:2; grid-row:3; }
    .pd-backpack { grid-column:3; grid-row:2 / 4; min-height:140px; }
    .pd-sec { grid-column:1; grid-row:4; }
    .pd-total { grid-column:1 / -1; grid-row:5; text-align:center; font-weight:800; color:var(--accent); font-size:1.1rem; padding:8px; }
    @media (max-width:640px) {
      .paperdoll { grid-template-columns:1fr 1fr; }
      .pd-helmet,.pd-headset,.pd-glasses,.pd-gun,.pd-armor,.pd-rig,.pd-backpack,.pd-sec,.pd-total { grid-column:auto; grid-row:auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Рандомный лоадаут</h1>
    <p class="sub">Как на персонаже · оружие без модов · броня · шлем · разгруз · рюкзак</p>
    <div class="card">
      <div class="row">
        <div class="field" style="max-width:160px"><label>Режим</label>
          <select id="gameMode"><option value="pve" selected>pve</option><option value="regular">regular</option><option value="pvp-season">pvp-season</option></select>
        </div>
        <button type="button" class="btn" id="btnGo">Сгенерировать</button>
      </div>
      <p class="status" id="status">Нажми «Сгенерировать»</p>
    </div>
    <div class="paperdoll" id="paperdoll"></div>
  </div>
  <script src="../core/tarkov-common.js"></script>
    <script src="tarkovtool-random-loadout.js"></script>
</body>
</html>
