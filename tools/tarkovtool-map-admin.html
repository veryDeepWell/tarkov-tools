<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта · админ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <link rel="stylesheet" href="../core/tarkov-ui.css">
  <style>
    html,body{height:100%;margin:0}
    .shell{display:flex;flex-direction:column;height:100%}
    .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border,#2a3038);background:var(--panel,#1a1d23)}
    .bar h1{font-size:1rem;margin:0 8px 0 0}
    #map{flex:1;min-height:0;background:#0b0d10}
    .gate{max-width:420px;margin:40px auto;padding:16px}
    .leaflet-container{background:#0b0d10;font:inherit}
    .tt-admin-icon{background:transparent!important;border:none!important}
    .tt-admin-icon span{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;background:#c9a227;color:#111;font-size:11px;font-weight:700;box-shadow:0 0 0 2px #111}
    .popup-form label{display:block;font-size:.8rem;opacity:.8;margin:6px 0 2px}
    .popup-form input,.popup-form select,.popup-form textarea{width:100%;box-sizing:border-box}
    .popup-form .row{display:flex;gap:6px}
    .popup-form .row>*{flex:1}
    .meta{opacity:.75;font-size:.85rem}
  </style>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-map-admin.html","title":"Карта · админ","description":"Редактор меток карты (только админ).","kind":"static","cat":"admin","icon":"util"}
  </script>
</head>
<body>
  <div id="gate" class="gate">
    <h1>Служебный доступ</h1>
    <p class="meta">Редактор карты доступен только в состоянии администратора. После перезагрузки страницы доступ сбрасывается.</p>
    <button type="button" class="btn" id="btnGate">Войти</button>
    <p><a href="tarkovtool-map.html">Обычная карта</a> · <a href="../tarkovtool-hub.html">Хаб</a></p>
  </div>

  <div id="app" class="shell" style="display:none">
    <div class="bar">
      <h1>Карта · админ</h1>
      <select id="mapSelect"></select>
      <select id="floorSelect" title="Этаж"></select>
      <button type="button" class="btn" id="btnAddMode">+ Метка</button>
      <button type="button" class="btn-ghost" id="btnSave">Сохранить</button>
      <button type="button" class="btn-ghost" id="btnExport">Экспорт JSON</button>
      <button type="button" class="btn-ghost" id="btnImport">Импорт</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <span class="meta" id="status"></span>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-session-gate.js"></script>
  <script src="../core/tarkov-map-overrides.js"></script>
  <script src="map-data-all.js"></script>
  <script src="../js/map-admin.js"></script>
</body>
</html>
