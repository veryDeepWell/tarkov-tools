<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <title>Дрип-лоадаут — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-drip-loadout.html","title":"Дрип-лоадаут","description":"Стили + цвета, раскладка как на персонаже.","file":"tarkovtool-drip-loadout.html"}
  </script>
  <style>
    .styles { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .style-chip { border:1px solid var(--border); background:var(--input-bg); border-radius:12px; padding:10px 14px; cursor:pointer; color:var(--text); text-align:left; min-width:140px; }
    .style-chip.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .style-chip .t { font-weight:700; } .style-chip .d { font-size:.78rem; color:var(--muted); margin-top:2px; }
    .paperdoll { display:grid; grid-template-columns:1fr 1.2fr 1fr; grid-template-rows:auto auto auto auto auto; gap:10px; max-width:720px; margin:0 auto; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; }
    .pd-slot { background:var(--input-bg); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center; min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
    .pd-slot .lab { font-size:.65rem; text-transform:uppercase; color:var(--muted); }
    .pd-slot img { width:56px; height:56px; object-fit:contain; border-radius:6px; background:var(--bg); }
    .pd-slot .nm { font-weight:700; font-size:.88rem; } .pd-slot .pr { color:var(--accent); font-size:.82rem; }
    .pd-slot.empty { opacity:.55; border-style:dashed; }
    .pd-helmet{grid-column:2;grid-row:1} .pd-headset{grid-column:1;grid-row:1} .pd-glasses{grid-column:3;grid-row:1}
    .pd-gun{grid-column:1;grid-row:2/4;min-height:140px} .pd-armor{grid-column:2;grid-row:2} .pd-rig{grid-column:2;grid-row:3}
    .pd-backpack{grid-column:3;grid-row:2/4;min-height:140px} .pd-sec{grid-column:1;grid-row:4}
    .pd-total{grid-column:1/-1;grid-row:5;text-align:center;font-weight:800;color:var(--accent);padding:8px}
    @media(max-width:640px){.paperdoll{grid-template-columns:1fr 1fr}.pd-helmet,.pd-headset,.pd-glasses,.pd-gun,.pd-armor,.pd-rig,.pd-backpack,.pd-sec,.pd-total{grid-column:auto;grid-row:auto}}
  </style>
</head>
<body>
  <div class="container">
    <h1>Дрип-лоадаут</h1>
    <p class="sub">Стиль + цвет · как на персонаже в игре</p>
    <div class="card">
      <div class="card-title">Стиль</div>
      <div class="styles" id="styles"></div>
      <div class="row">
        <div class="field" style="max-width:160px"><label>Режим</label>
          <select id="gameMode"><option value="pve" selected>pve</option><option value="regular">regular</option><option value="pvp-season">pvp-season</option></select>
        </div>
        <button type="button" class="btn" id="btnGo">Собрать лук</button>
      </div>
      <p class="status" id="status">Выбери стиль и жми «Собрать»</p>
    </div>
    <div class="paperdoll" id="paperdoll"></div>
  </div>

  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-drip-loadout.js"></script>
</body>
</html>
