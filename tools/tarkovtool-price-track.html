<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <title>Динамика цен — Tarkov</title>
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Динамика цен", "description": "Снимки flea avg/low/high, график, фон, countdown."}
  </script>
  <style>
    .layout { display:grid; grid-template-columns:1fr 1.2fr; gap:12px; }
    @media(max-width:900px){ .layout{grid-template-columns:1fr;} }
    .item-row { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); cursor:pointer; }
    .item-row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .item-row img { width:36px; height:36px; object-fit:contain; border-radius:6px; background:var(--input-bg); }
    .item-row .nm { font-weight:600; }
    .item-row .pr { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--accent); }
    #itemList { max-height:420px; overflow:auto; }
    .chart-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; align-items:center; }
    .chart-toolbar .chip { border:1px solid var(--border); background:var(--input-bg); color:var(--muted); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.85rem; }
    .chart-toolbar .chip.on { border-color:var(--accent); color:var(--text); background:color-mix(in srgb, var(--accent) 18%, transparent); }
    .chart-wrap { position:relative; min-height:320px; background:#12151c; border-radius:10px; border:1px solid var(--border); overflow:hidden; }
    #chart { display:block; width:100%; height:320px; }
    .chart-tip { position:absolute; left:12px; top:12px; background:rgba(15,17,21,.92); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:.8rem; pointer-events:none; max-width:90%; }
    .countdown { font-weight:700; font-variant-numeric:tabular-nums; margin-top:8px; color:var(--muted); }
    .countdown.on { color:var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Динамика цен</h1>
    <p class="sub">Фоновые снимки · клик по предмету = график · обратный отсчёт до следующего API-снимка</p>
    <div class="card">
      <div class="card-title">Сбор цен</div>
      <div class="row">
        <div class="field"><label>Режим API</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <div class="field"><label>Интервал, мин</label>
          <input type="number" id="interval" min="1" max="180" value="30">
        </div>
        <button type="button" class="btn" id="startBtn">Старт фона</button>
        <button type="button" class="btn-ghost" id="stopBtn">Стоп</button>
        <button type="button" class="btn-ghost" id="snapBtn">Снять сейчас</button>
      </div>
      <p class="status" id="status">Хранит avg24h / lastLow / high24h.</p>
      <p class="meta" id="trackMeta"></p>
      <p class="countdown" id="countdown">Обратный отсчёт: —</p>
    </div>
    <div class="layout">
      <div class="card">
        <div class="card-title">Предметы</div>
        <input type="search" id="q" placeholder="Фильтр…" style="margin-bottom:8px">
        <div id="itemList" class="meta">Пока пусто</div>
      </div>
      <div class="card">
        <div class="card-title" id="chartTitle">Выбери предмет</div>
        <div class="chart-toolbar">
          <button type="button" class="chip on" data-series="avg">avg</button>
          <button type="button" class="chip on" data-series="low">low</button>
          <button type="button" class="chip on" data-series="high">high</button>
          <button type="button" class="btn-ghost" id="chartResetZoom" style="min-width:auto;min-height:28px;padding:0 10px">Сброс зума</button>
        </div>
        <div class="chart-wrap">
          <canvas id="chart" width="900" height="320"></canvas>
          <div id="chartTip" class="chart-tip" style="display:none"></div>
        </div>
        <p class="meta" id="chartMeta"></p>
        <p class="meta">Колесо — зум · наведение — цена в точке</p>
      </div>
    </div>
  </div>
  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-price-track.js"></script>
  <script src="tarkov-price-track-boot.js"></script>
</body>
</html>
