<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта — Tarkov Tools</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-map.html","title":"Карта","description":"Интерактивные карты EFT: extracts, spawns, loot, quests","file":"tarkovtool-map.html","cat":"util","kind":"static","icon":"map"}
  </script>
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
    .map-shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
    .map-toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);z-index:1000}
    .map-toolbar h1{font-size:1rem;margin:0 6px 0 0;white-space:nowrap}
    .map-toolbar select{min-width:130px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:.9rem;min-height:34px}
    .map-toolbar .btn-ghost{min-width:auto!important;min-height:34px!important;height:34px;padding:0 12px!important;font-size:.85rem}
    .map-body{flex:1 1 auto;display:flex;min-height:0;position:relative}
    #map{flex:1;height:100%;background:#1a1a1a}
    .filter-panel{width:280px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:0;display:flex;flex-direction:column}
    .filter-panel.hidden{display:none}
    .fp-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
    .fp-head strong{font-size:.85rem;flex:1}
    .fp-head button{min-width:auto!important;min-height:28px!important;height:28px;padding:0 8px!important;font-size:.75rem}
    .fg{border-bottom:1px solid var(--border)}
    .fg-title{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;user-select:none;font-size:.82rem;font-weight:600;color:var(--text)}
    .fg-title:hover{background:var(--input-bg)}
    .fg-title .arrow{font-size:.65rem;color:var(--muted);width:12px;transition:transform .15s}
    .fg-title input{accent-color:var(--accent);margin:0}
    .fg-body{padding:0 8px 8px 28px;display:none}
    .fg.open .fg-body{display:block}
    .fg.open .arrow{transform:rotate(90deg)}
    .fi{display:flex;align-items:center;gap:6px;padding:3px 4px;font-size:.78rem;color:var(--muted);cursor:pointer;border-radius:4px}
    .fi:hover{background:var(--input-bg);color:var(--text)}
    .fi input{accent-color:var(--accent);margin:0}
    .fi img{width:16px;height:16px;object-fit:contain}
    .fi .cnt{margin-left:auto;font-size:.7rem;color:var(--muted);opacity:.7}
    .leaflet-container{background:#1a1a1a;font-family:inherit}
    .leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .leaflet-popup-tip{background:var(--card)}
    .leaflet-popup-content{margin:10px 14px;font-size:.9rem}
    .leaflet-popup-content strong{color:var(--accent)}
    .leaflet-control-zoom a{background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important}
    .tt-marker-icon{background:transparent!important;border:none!important}
    .tt-marker-icon img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
    .tt-marker-ghost{opacity:.35}
    .tt-marker-ghost img{filter:grayscale(.4) drop-shadow(0 1px 2px rgba(0,0,0,.5))}
    .status-bar{display:none!important}
    .tt-label{background:transparent!important;border:none!important}
    .tt-label span{display:inline-block;background:rgba(15,17,21,.78);color:var(--accent);font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap;border:1px solid rgba(201,162,39,.35);pointer-events:none}
    .credit{position:absolute;bottom:8px;left:10px;z-index:800;font-size:.65rem;color:rgba(201,162,39,.6);background:rgba(0,0,0,.5);padding:2px 7px;border-radius:4px;pointer-events:none}
    .status-bar{position:absolute;top:10px;right:10px;z-index:800;font-size:.75rem;color:var(--muted);background:rgba(15,17,21,.85);padding:4px 10px;border-radius:6px;border:1px solid var(--border)}
    @media(max-width:800px){.filter-panel{position:absolute;right:0;top:0;bottom:0;z-index:900;box-shadow:-4px 0 20px rgba(0,0,0,.4)}}
  </style>
</head>
<body>
  <div class="map-shell">
    <div class="map-toolbar">
      <h1>Карта</h1>
      <select id="mapSelect"></select>
      <select id="floorSelect" title="Этаж" style="display:none"></select>
      <button type="button" class="btn-ghost" id="btnFilters">☰ Слои</button>
      <button type="button" class="btn-ghost" id="btnSettings">⚙</button>
      <button type="button" class="btn-ghost" id="btnFit">⤢</button>
      <button type="button" class="btn-ghost" id="btnAll">Все</button>
      <button type="button" class="btn-ghost" id="btnNone">Нет</button>
    </div>
    <div class="map-body">
      <div id="map"></div>
      <div class="filter-panel" id="filterPanel">
        <div class="fp-head">
          <strong>Слои</strong>
          <button type="button" class="btn-ghost" id="btnAll2">Все</button>
          <button type="button" class="btn-ghost" id="btnNone2">Нет</button>
        </div>
        <div id="filterGroups"></div>
      </div>
      <div class="filter-panel settings-panel hidden" id="settingsPanel">
        <div class="fp-head"><strong>Настройки меток</strong></div>
        <div style="padding:12px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:10px">
          <label class="fi" style="cursor:pointer">
            <input type="checkbox" id="optShowAllFloors">
            <span>Показывать метки с других этажей</span>
          </label>
          <p style="margin:0;font-size:.75rem;opacity:.8">Если выключено — видны только метки текущего этажа. Если включено — метки других этажей полупрозрачные.</p>
        </div>
      </div>
      <div class="credit">SVG © the-hideout (CC BY-NC-SA) · данные json.tarkov.dev</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="map-data-all.js"></script>
  <script>
  (function () {
    var ASSETS = "map-assets/";
    var GROUPS = window.TT_MAP_GROUPS;
    var MAPS = window.TT_MAPS || {};
    var ORDER = window.TT_MAP_ORDER || Object.keys(MAPS);

    var FILTER_ICON = {};
    GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        if (it.icon) FILTER_ICON[it.id] = ASSETS + it.icon;
      });
    });

    var activeFilters = new Set();
    GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        if (it.defaultOn) activeFilters.add(it.id);
      });
    });

    var layerByFilter = {};
    var imageOverlay = null;
    var activeZoneLayer = null;
    var activeZoneKey = null;
    var currentMapId = "customs";
    var currentFloor = "ground";
    var showAllFloors = false;
    var BOUNDS = [[0, 0], [535.17, 1062.48]];
    var allMarkers = []; // {layer, item, fid}

    try {
      showAllFloors = (window.TarkovStorage && TarkovStorage.get("tt-map-show-all-floors", "0")) === "1";
    } catch (e) {}

    var map = L.map("map", {
      crs: L.CRS.Simple,
      minZoom: -2, maxZoom: 4,
      zoomSnap: 0.25, zoomDelta: 0.5,
      attributionControl: false
    });

    function toLatLng(x, y) { return [BOUNDS[1][0] - y, x]; }

    function iconFor(filterId, ghost) {
      var url = FILTER_ICON[filterId] || ASSETS + "loose_loot.png";
      return L.divIcon({
        className: "tt-marker-icon" + (ghost ? " tt-marker-ghost" : ""),
        html: '<img src="' + url + '" alt="">',
        iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12]
      });
    }

    function labelIcon(name) {
      return L.divIcon({
        className: "tt-label",
        html: "<span>" + name + "</span>",
        iconSize: [90, 16], iconAnchor: [45, 8]
      });
    }

    function fillMapSelect() {
      var sel = document.getElementById("mapSelect");
      sel.innerHTML = "";
      ORDER.forEach(function (id) {
        if (!MAPS[id]) return;
        var opt = document.createElement("option");
        opt.value = id;
        opt.textContent = MAPS[id].title || id;
        if (id === currentMapId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function fillFloorSelect() {
      var meta = MAPS[currentMapId];
      var sel = document.getElementById("floorSelect");
      var floors = (meta && meta.floors) || [];
      if (floors.length <= 1) {
        sel.style.display = "none";
        currentFloor = floors[0] ? floors[0].id : "ground";
        return;
      }
      sel.style.display = "";
      sel.innerHTML = "";
      floors.forEach(function (f, i) {
        var opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = f.name || f.id;
        sel.appendChild(opt);
      });
      // keep previous if exists
      var has = floors.some(function (f) { return f.id === currentFloor; });
      if (!has) currentFloor = floors[0].id;
      sel.value = currentFloor;
    }

    function buildFiltersUI() {
      var meta = MAPS[currentMapId];
      var DATA = (meta && meta.data) || {};
      var host = document.getElementById("filterGroups");
      host.innerHTML = "";
      GROUPS.forEach(function (g) {
        var counts = {};
        g.items.forEach(function (it) { counts[it.id] = 0; });
        (DATA[g.id] || []).forEach(function (m) {
          if (m.filter && counts[m.filter] !== undefined) {
            if (showAllFloors || !m.floor || m.floor === currentFloor) counts[m.filter]++;
          }
        });

        var fg = document.createElement("div");
        fg.className = "fg open";
        var title = document.createElement("div");
        title.className = "fg-title";
        var groupChecked = g.items.some(function (it) { return activeFilters.has(it.id); });
        title.innerHTML = '<span class="arrow">▶</span><input type="checkbox"' + (groupChecked ? " checked" : "") + '><span>' + g.name + '</span>';
        title.querySelector("input").addEventListener("click", function (e) {
          e.stopPropagation();
          var on = e.target.checked;
          g.items.forEach(function (it) {
            var fi = fg.querySelector('[data-filter="' + it.id + '"] input');
            if (fi) fi.checked = on;
            if (on) activeFilters.add(it.id); else activeFilters.delete(it.id);
          });
          applyFilters();
        });
        title.addEventListener("click", function (e) {
          if (e.target.tagName === "INPUT") return;
          fg.classList.toggle("open");
        });
        fg.appendChild(title);

        var body = document.createElement("div");
        body.className = "fg-body";
        g.items.forEach(function (it) {
          var row = document.createElement("label");
          row.className = "fi";
          row.dataset.filter = it.id;
          var checked = activeFilters.has(it.id) ? " checked" : "";
          var icon = it.icon ? '<img src="' + ASSETS + it.icon + '" alt="">' : "";
          row.innerHTML = '<input type="checkbox"' + checked + '>' + icon + '<span>' + it.name + '</span><span class="cnt">' + (counts[it.id] || 0) + '</span>';
          row.querySelector("input").addEventListener("change", function (e) {
            if (e.target.checked) activeFilters.add(it.id); else activeFilters.delete(it.id);
            applyFilters();
            title.querySelector("input").checked = g.items.some(function (x) { return activeFilters.has(x.id); });
          });
          body.appendChild(row);
        });
        fg.appendChild(body);
        host.appendChild(fg);
      });
    }

    function markerVisible(item) {
      if (!activeFilters.has(item.filter)) return false;
      if (showAllFloors) return true;
      if (!item.floor) return true;
      return item.floor === currentFloor;
    }

    function isGhost(item) {
      return showAllFloors && item.floor && item.floor !== currentFloor;
    }

    function applyFilters() {
      allMarkers.forEach(function (rec) {
        var vis = markerVisible(rec.item);
        var ghost = isGhost(rec.item);
        if (vis) {
          if (!map.hasLayer(rec.layer)) map.addLayer(rec.layer);
          // update icon ghost state for markers
          if (rec.layer.setIcon && rec.item.filter && rec.item.filter.indexOf("landmark") !== 0) {
            try {
              rec.layer.setIcon(iconFor(rec.item.filter, ghost));
            } catch (e) {}
          }
          if (rec.layer.setStyle) {
            rec.layer.setStyle({ opacity: ghost ? 0.35 : 1, fillOpacity: ghost ? 0.08 : 0.2 });
          }
        } else {
          if (map.hasLayer(rec.layer)) map.removeLayer(rec.layer);
        }
      });
    }

    function clearActiveZone() {
      if (activeZoneLayer) {
        map.removeLayer(activeZoneLayer);
        activeZoneLayer = null;
        activeZoneKey = null;
      }
    }

    function showZoneFor(item, key) {
      if (activeZoneKey === key) { clearActiveZone(); return; }
      clearActiveZone();
      if (!item.outline || item.outline.length < 3) return;
      var latlngs = item.outline.map(function (p) { return toLatLng(p[0], p[1]); });
      activeZoneLayer = L.polygon(latlngs, {
        color: "#f0c040", weight: 2, fillColor: "#f0c040", fillOpacity: 0.25, interactive: false
      });
      activeZoneLayer.addTo(map);
      activeZoneKey = key;
    }

    function loadMap(mapId) {
      if (mapId) currentMapId = mapId;
      var meta = MAPS[currentMapId];
      if (!meta) return;
      var DATA = meta.data || {};
      BOUNDS = [[0, 0], [meta.H, meta.W]];
      fillFloorSelect();

      if (imageOverlay) map.removeLayer(imageOverlay);
      clearActiveZone();
      Object.keys(layerByFilter).forEach(function (k) {
        if (map.hasLayer(layerByFilter[k])) map.removeLayer(layerByFilter[k]);
      });
      layerByFilter = {};
      allMarkers = [];

      imageOverlay = L.imageOverlay(ASSETS + meta.svg, BOUNDS, { interactive: false, opacity: 0.95 });
      imageOverlay.addTo(map);
      map.fitBounds(BOUNDS, { padding: [16, 16] });

      function track(layer, item) {
        allMarkers.push({ layer: layer, item: item });
        var fid = item.filter;
        if (!layerByFilter[fid]) layerByFilter[fid] = L.layerGroup();
        layerByFilter[fid].addLayer(layer);
      }

      function addList(list, isLabel) {
        (list || []).forEach(function (item, idx) {
          var fid = item.filter;
          if (!fid) return;
          if (item.outline && item.outline.length >= 3 && fid.indexOf("task-") !== 0) {
            var latlngs = item.outline.map(function (p) { return toLatLng(p[0], p[1]); });
            var poly = L.polygon(latlngs, {
              color: "#e05050", weight: 1.5, fillColor: "#e05050", fillOpacity: 0.2
            });
            poly.bindPopup("<strong>" + item.name + "</strong>");
            track(poly, item);
          }
          var m;
          if (isLabel) {
            m = L.marker(toLatLng(item.x, item.y), { icon: labelIcon(item.name) });
          } else {
            m = L.marker(toLatLng(item.x, item.y), { icon: iconFor(fid, false) });
            var note = item.note ? '<br><span style="color:var(--muted)">' + item.note + "</span>" : "";
            var fac = item.faction ? " · " + item.faction : "";
            var fl = item.floor ? '<br><span style="color:var(--muted)">Этаж: ' + item.floor + "</span>" : "";
            var tip = "<strong>" + item.name + "</strong>" + fac + note + fl;
            if (fid === "task-zone" && item.outline && item.outline.length >= 3) {
              tip += '<br><span style="color:#f0c040">Клик — показать зону</span>';
            }
            m.bindPopup(tip);
            if (fid === "task-zone") {
              (function (it, i) {
                m.on("click", function () {
                  showZoneFor(it, it.name + "|" + it.x + "|" + it.y + "|" + i);
                });
              })(item, idx);
            }
          }
          track(m, item);
        });
      }

      addList(DATA.extracts);
      addList(DATA.spawns);
      addList(DATA.lootables);
      addList(DATA.looseLoot);
      addList(DATA.hazards);
      addList(DATA.landmarks, true);
      addList(DATA.switches);
      addList(DATA.tasks);

      applyFilters();
      buildFiltersUI();
    }

    function setAll(on) {
      GROUPS.forEach(function (g) {
        g.items.forEach(function (it) {
          if (on) activeFilters.add(it.id); else activeFilters.delete(it.id);
        });
      });
      buildFiltersUI();
      applyFilters();
    }

    document.getElementById("mapSelect").addEventListener("change", function (e) {
      loadMap(e.target.value);
    });
    document.getElementById("floorSelect").addEventListener("change", function (e) {
      currentFloor = e.target.value;
      clearActiveZone();
      applyFilters();
      buildFiltersUI();
    });
    document.getElementById("btnFilters").addEventListener("click", function () {
      document.getElementById("settingsPanel").classList.add("hidden");
      document.getElementById("filterPanel").classList.toggle("hidden");
    });
    document.getElementById("btnSettings").addEventListener("click", function () {
      document.getElementById("filterPanel").classList.add("hidden");
      document.getElementById("settingsPanel").classList.toggle("hidden");
    });
    document.getElementById("optShowAllFloors").checked = showAllFloors;
    document.getElementById("optShowAllFloors").addEventListener("change", function (e) {
      showAllFloors = e.target.checked;
      try { if (window.TarkovStorage) TarkovStorage.set("tt-map-show-all-floors", showAllFloors ? "1" : "0"); } catch (err) {}
      applyFilters();
      buildFiltersUI();
    });
    document.getElementById("btnFit").addEventListener("click", function () {
      map.fitBounds(BOUNDS, { padding: [16, 16] });
    });
    document.getElementById("btnAll").addEventListener("click", function () { setAll(true); });
    document.getElementById("btnNone").addEventListener("click", function () { setAll(false); });
    document.getElementById("btnAll2").addEventListener("click", function () { setAll(true); });
    document.getElementById("btnNone2").addEventListener("click", function () { setAll(false); });

    fillMapSelect();
    loadMap(currentMapId);
    try {
      if (window.parent !== window) window.parent.postMessage({ type: "tt-tool-ready", tool: "map" }, "*");
    } catch (e) {}
  })();
  </script></script>
</body>
</html>
