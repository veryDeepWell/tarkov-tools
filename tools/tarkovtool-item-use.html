<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Redirect…</title>
  <script>
    (function () {
      var q = location.search || "";
      var hash = location.hash || "";
      // map legacy ?id= to ?item=
      try {
        var sp = new URLSearchParams(q);
        if (sp.get("id") && !sp.get("item")) {
          sp.set("item", sp.get("id"));
          sp.delete("id");
          q = "?" + sp.toString();
        }
      } catch (e) {}
      location.replace("tarkovtool-item-card.html" + q + hash);
    })();
  </script>
</head>
<body>
  <p><a href="tarkovtool-item-card.html">Карточка предмета</a></p>
</body>
</html>
