<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка предмета — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {
    "catalog": false,
    "title": "Карточка предмета",
    "description": "Совместимость со старыми ссылками на использование предметов. Перенаправление на карточку предмета.",
    "cat": "other",
    "kind": "static",
    "icon": "other"
  }
  </script>
  <script>
    (function () {
      var q = location.search || "";
      var hash = location.hash || "";
      // map legacy ?id= to ?item=
      try {
        var sp = new URLSearchParams(q);
        if (sp.get("id") && !sp.get("item")) {
          sp.set("item", sp.get("id"));
          sp.delete("id");
          q = "?" + sp.toString();
        }
      } catch (e) {}
      location.replace("tarkovtool-item-card.html" + q + hash);
    })();
  </script>
</head>
<body>
  <p><a href="tarkovtool-item-card.html">Карточка предмета</a></p>
</body>
</html>
