</head>
<body>
  <div class="container">
    <h1 data-i18n="tool.gun-builder.ui.heading">Сборка оружия</h1>
    <p class="sub" data-i18n="tool.gun-builder.ui.subtitle">Схема как в игре (дуло слева → приклад справа), зоны узлов, зум, Auto Build.</p>
    <div class="card">
      <div class="card-title" data-i18n="tool.gun-builder.ui.data">Данные</div>
      <div class="row">
        <div class="field"><label data-i18n="tool.gun-builder.ui.mode">Режим</label>
          <select id="gameMode">
            <option value="pve" selected>PvE</option>
            <option value="regular">PvP</option>
          </select>
        </div>
        <button type="button" class="btn-outline" id="loadBtn" data-i18n="tool.gun-builder.ui.loadCatalog">Загрузить каталог</button>
      </div>
      <p class="status" id="status" data-i18n="tool.gun-builder.ui.loadPrompt">Загрузи каталог предметов.</p>
    </div>
    <div class="card" id="pickCard" style="display:none">
      <div class="card-title" data-i18n="tool.gun-builder.ui.weapons">Оружие</div>
      <div class="field">
        <label data-i18n="tool.gun-builder.ui.search">Поиск</label>
        <input type="search" id="weaponQ" data-i18n-placeholder="tool.gun-builder.ui.searchPlaceholder" placeholder="AK-74M, M4A1, RSASS…" autocomplete="off">
        <div class="suggest" id="weaponSuggest"></div>
      </div>
    </div>
    <div class="card" id="buildCard" style="display:none">
      <div class="card-title" data-i18n="tool.gun-builder.ui.schematic">Схема сборки</div>
      <div class="schema-toolbar">
        <button type="button" class="btn-sm accent" id="zoomOut" title="Отдалить" data-i18n-title="tool.gun-builder.ui.zoomOut">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button type="button" class="btn-sm accent" id="zoomIn" title="Приблизить" data-i18n-title="tool.gun-builder.ui.zoomIn">+</button>
        <button type="button" class="btn-sm" id="zoomReset" data-i18n="tool.gun-builder.ui.reset">Сброс</button>
        <span class="muted" data-i18n="tool.gun-builder.ui.zoomHelp">колёсико мыши · перетаскивание</span>
      </div>
      <div class="schema-viewport" id="schemaViewport">
        <div class="schema-inner" id="schemaInner">
          <div class="schema-gun" id="schematic"></div>
        </div>
      </div>
      <div class="card-title" style="margin-top:14px" data-i18n="tool.gun-builder.ui.stats">Статы</div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <button type="button" class="btn-sm" id="clearBuild" data-i18n="tool.gun-builder.ui.clearMods">Сбросить моды</button>
        <button type="button" class="btn-sm accent" id="copyBuild" data-i18n="tool.gun-builder.ui.copyBuild">Копировать список</button>
      </div>
    </div>
    <div class="layout" id="mainLayout" style="display:none">
      <div class="card">
        <div class="card-title" data-i18n="tool.gun-builder.ui.slots">Слоты</div>
        <div id="slotList"></div>
      </div>
      <div class="card">
        <div class="card-title" data-i18n="tool.gun-builder.ui.autoBuild">Auto Build</div>
        <div class="chips" id="abGoal">
          <button type="button" class="chip on" data-g="balanced" data-i18n="tool.gun-builder.ui.goalBalanced">Balanced</button>
          <button type="button" class="chip" data-g="maxErgo" data-i18n="tool.gun-builder.ui.goalMaxErgo">Max ergo</button>
          <button type="button" class="chip" data-g="minRecoil" data-i18n="tool.gun-builder.ui.goalMinRecoil">Min recoil</button>
          <button type="button" class="chip" data-g="budget" data-i18n="tool.gun-builder.ui.goalBudget">Budget</button>
        </div>
        <div class="row">
          <div class="field"><label data-i18n="tool.gun-builder.ui.budget">Бюджет ₽ (0 = без лимита)</label>
            <input type="number" id="abBudget" min="0" step="1000" value="0">
          </div>
          <div class="field"><label data-i18n="tool.gun-builder.ui.onlyBuyable">Только покупаемое</label>
            <select id="abBuyable">
              <option value="1" selected data-i18n="tool.gun-builder.ui.buyableYes">Да (flea / trader)</option>
              <option value="0" data-i18n="tool.gun-builder.ui.no">Нет</option>
            </select>
          </div>
        </div>
        <label class="check-row">
          <input type="checkbox" id="abForceOptic" checked>
          <span data-i18n="tool.gun-builder.ui.forceOptic">Обязательно ставить прицел / оптику</span>
        </label>
        <div class="toolbar">
          <button type="button" class="btn-outline" id="abScan" data-i18n="tool.gun-builder.ui.scan">Сканировать</button>
        </div>
        <p class="note" id="abStatus" data-i18n="tool.gun-builder.ui.scanPrompt">Выбери цель и жми «Сканировать». Лучшие варианты появятся ниже; клик — применить.</p>
        <div class="chart-wrap">
          <svg class="chart" id="abChart" viewBox="0 0 560 250" role="img" aria-label="Auto Build chart"></svg>
          <div class="chart-tip" id="abChartTip"></div>
        </div>
        <div class="ab-results" id="abResults"></div>
      </div>
    </div>
  </div>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <strong id="modalTitle">Слот</strong>
        <button type="button" class="btn-sm" id="modalClose" data-i18n="tool.gun-builder.ui.modalClose">Закрыть</button>
      </div>
      <input type="search" id="modalFilter" data-i18n-placeholder="tool.gun-builder.ui.modalFilter" placeholder="Фильтр модов…" style="width:100%;margin-bottom:10px">
      <div id="modalList"></div>
    </div>
  </div>
  <script type="module" src="../core/tarkov-dicts.js"></script>
  <script type="module" src="../core/tarkov-names.js"></script>
  <script type="module" src="../core/tarkov-storage.js"></script>
  <script type="module" src="../core/tarkov-api.js"></script>
  <script type="module" src="../core/tarkov-weapon-domain.js"></script>
  <script type="module" src="../core/tarkov-ui.js"></script>
  <script type="module" src="../core/tarkov-state.js"></script>
  <script type="module" src="../core/tarkov-common.js"></script>
  <script type="module" src="../js/gun-builder.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
