<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сборка оружия — Tarkov</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title":"Сборка оружия","description":"Схема (дуло←приклад), зоны, зум, Auto Build.","kind":"static"}
  </script>
  <style>
    .container { max-width: min(1200px, 96vw); margin: 0 auto; padding: 12px 14px 64px; }
    h1 { margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 14px; font-size: .92rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .card-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field { flex: 1; min-width: 120px; }
    .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .status { font-size: .9rem; color: var(--muted); margin-top: 8px; }
    .status.ok { color: var(--green, #3dd68c); }
    .status.err { color: var(--red, #f07178); }
    .muted { color: var(--muted); font-size: .8rem; }
    button.btn-outline, .btn-outline {
      background: transparent !important;
      color: var(--accent) !important;
      border: 1px solid var(--accent) !important;
      border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer;
    }
    button.btn-outline:hover, .btn-outline:hover {
      background: color-mix(in srgb, var(--accent) 14%, transparent) !important;
    }
    button.btn-outline:disabled { opacity: .45; cursor: default; }
    .suggest {
      max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 8px;
      margin-top: 6px; display: none;
    }
    .suggest button {
      display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0;
      border-bottom: 1px solid var(--border); background: var(--input-bg); color: var(--text);
      cursor: pointer; font-size: .85rem;
    }
    .suggest button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .stat { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .stat .v { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    .stat .l { font-size: .7rem; color: var(--muted); margin-top: 2px; }
    .schema-toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px;
    }
    .schema-toolbar .zoom-val {
      font-size: .85rem; color: var(--muted); min-width: 48px; text-align: center;
    }
    .schema-viewport {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0a0c10;
      max-height: 420px;
      cursor: grab;
      position: relative;
    }
    .schema-viewport.dragging { cursor: grabbing; }
    .schema-inner {
      transform-origin: 50% 50%;
      transition: transform .12s ease-out;
      padding: 24px 16px;
      min-width: max-content;
    }
    .schema-gun {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 10px;
      justify-content: center;
    }
    .region {
      border: 1px dashed color-mix(in srgb, var(--accent) 35%, var(--border));
      border-radius: 12px;
      padding: 8px;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 100px;
    }
    .region-label {
      font-size: .65rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--accent); text-align: center; font-weight: 700; opacity: .85;
    }
    .region-row { display: flex; flex-direction: row; gap: 8px; align-items: flex-start; justify-content: center; }
    .region-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .slot-box {
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px;
      background: var(--input-bg); text-align: center; cursor: pointer;
      min-height: 86px; width: 108px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .slot-box:hover { border-color: var(--accent); }
    .slot-box.has {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .slot-box.core {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--input-bg));
      width: 124px; min-height: 100px;
    }
    .slot-box.req:not(.has) { border-style: dashed; }
    .slot-box.conflict { border-color: #f07178; background: color-mix(in srgb, #f07178 12%, var(--input-bg)); }
    .slot-box.optic-forced:not(.has) {
      border-color: #5b9fd4;
      box-shadow: 0 0 0 1px color-mix(in srgb, #5b9fd4 40%, transparent);
    }
    .slot-box img {
      width: 48px; height: 48px; object-fit: contain; margin: 4px 0;
      background: #0a0c10; border-radius: 6px;
    }
    .slot-box .slot-label {
      font-size: .62rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin-bottom: 2px;
    }
    .slot-box .mod-name {
      font-size: .72rem; font-weight: 600; line-height: 1.25; max-width: 100%;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .slot-box.empty .meta { font-size: .75rem; color: var(--muted); }
    .nested {
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-radius: 10px; padding: 6px; background: rgba(0,0,0,.25);
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      max-width: 240px;
    }
    .nested .slot-box { width: 96px; min-height: 78px; }
    .nested .slot-box img { width: 40px; height: 40px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 840px) { .layout { grid-template-columns: 1fr; } }
    .slot {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 8px 0; border-top: 1px solid var(--border); font-size: .88rem;
    }
    .slot.req .slot-name::after { content: " *"; color: var(--accent); }
    .slot.conflict { background: color-mix(in srgb, #f07178 10%, transparent); border-radius: 6px; padding-left: 6px; }
    .slot-name { font-weight: 600; }
    .slot-meta { font-size: .75rem; color: var(--muted); }
    .slot-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm {
      font-size: .75rem; padding: 4px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent !important; color: var(--text) !important; cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
    .btn-sm.accent { border-color: var(--accent) !important; color: var(--accent) !important; background: transparent !important; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      border: 1px solid var(--border); background: transparent !important; color: var(--text) !important;
      border-radius: 999px; padding: 5px 12px; font-size: .8rem; cursor: pointer;
    }
    .chip.on {
      border-color: var(--accent) !important; color: var(--accent) !important;
      background: color-mix(in srgb, var(--accent) 12%, transparent) !important;
    }
    .ab-results { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; }
    .ab-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--input-bg);
    }
    .ab-card:hover, .ab-card.on { border-color: var(--accent); }
    .ab-card .t { font-weight: 700; margin-bottom: 4px; }
    .ab-card .m { font-size: .78rem; color: var(--muted); }
    .chart {
      width: 100%; height: 180px; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; margin-top: 8px;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
      align-items: center; justify-content: center; z-index: 80; padding: 16px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      max-width: 720px; width: 100%; max-height: 82vh; overflow: auto; padding: 16px;
    }
    .mod-pick {
      display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px;
      cursor: pointer; border: 1px solid transparent;
    }
    .mod-pick:hover { background: rgba(255,255,255,.04); border-color: var(--border); }
    .mod-pick .ico { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; background: #0a0c10; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .note { font-size: .82rem; color: var(--muted); line-height: 1.45; margin-top: 8px; }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: .85rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Сборка оружия</h1>
    <p class="sub">Схема как в игре (дуло слева → приклад справа), зоны узлов, зум, Auto Build.</p>

    <div class="card">
      <div class="card-title">Данные</div>
      <div class="row">
        <div class="field"><label>Режим</label>
          <select id="gameMode">
            <option value="pve" selected>PvE</option>
            <option value="regular">PvP</option>
          </select>
        </div>
        <button type="button" class="btn-outline" id="loadBtn">Загрузить каталог</button>
      </div>
      <p class="status" id="status">Загрузи каталог предметов.</p>
    </div>

    <div class="card" id="pickCard" style="display:none">
      <div class="card-title">Оружие</div>
      <div class="field">
        <label>Поиск</label>
        <input type="search" id="weaponQ" placeholder="AK-74M, M4A1, RSASS…" autocomplete="off">
        <div class="suggest" id="weaponSuggest"></div>
      </div>
    </div>

    <div class="card" id="buildCard" style="display:none">
      <div class="card-title">Схема сборки</div>
      <div class="schema-toolbar">
        <button type="button" class="btn-sm accent" id="zoomOut" title="Отдалить">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button type="button" class="btn-sm accent" id="zoomIn" title="Приблизить">+</button>
        <button type="button" class="btn-sm" id="zoomReset">Сброс</button>
        <span class="muted">колёсико мыши · перетаскивание</span>
      </div>
      <div class="schema-viewport" id="schemaViewport">
        <div class="schema-inner" id="schemaInner">
          <div class="schema-gun" id="schematic"></div>
        </div>
      </div>
      <div class="card-title" style="margin-top:14px">Статы</div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <button type="button" class="btn-sm" id="clearBuild">Сбросить моды</button>
        <button type="button" class="btn-sm accent" id="copyBuild">Копировать список</button>
      </div>
    </div>

    <div class="layout" id="mainLayout" style="display:none">
      <div class="card">
        <div class="card-title">Слоты</div>
        <div id="slotList"></div>
      </div>
      <div class="card">
        <div class="card-title">Auto Build</div>
        <div class="chips" id="abGoal">
          <button type="button" class="chip on" data-g="balanced">Balanced</button>
          <button type="button" class="chip" data-g="maxErgo">Max ergo</button>
          <button type="button" class="chip" data-g="minRecoil">Min recoil</button>
          <button type="button" class="chip" data-g="budget">Budget</button>
        </div>
        <div class="row">
          <div class="field"><label>Бюджет ₽ (0 = без лимита)</label>
            <input type="number" id="abBudget" min="0" step="1000" value="0">
          </div>
          <div class="field"><label>Только покупаемое</label>
            <select id="abBuyable">
              <option value="1" selected>Да (flea / trader)</option>
              <option value="0">Нет</option>
            </select>
          </div>
        </div>
        <label class="check-row">
          <input type="checkbox" id="abForceOptic" checked>
          Обязательно ставить прицел / оптику
        </label>
        <div class="toolbar">
          <button type="button" class="btn-outline" id="abScan">Сканировать</button>
        </div>
        <p class="note" id="abStatus">Выбери цель и жми «Сканировать». Лучшие варианты появятся ниже; клик — применить.</p>
        <svg class="chart" id="abChart" viewBox="0 0 400 180" preserveAspectRatio="none"></svg>
        <div class="ab-results" id="abResults"></div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <strong id="modalTitle">Слот</strong>
        <button type="button" class="btn-sm" id="modalClose">Закрыть</button>
      </div>
      <input type="search" id="modalFilter" placeholder="Фильтр модов…" style="width:100%;margin-bottom:10px">
      <div id="modalList"></div>
    </div>
  </div>

  <script src="../core/tarkov-dicts.js"></script>
  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-gun-builder.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
