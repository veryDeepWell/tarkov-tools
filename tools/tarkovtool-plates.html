<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плиты — Tarkov</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"id": "tarkovtool-plates.html", "title": "Плиты", "description": "Эффективность плит: класс, вес, прочность, стоимость ремонта.", "file": "tarkovtool-plates.html"}
  </script>


  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1600px,92vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .card-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    select,input{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;font-size:1rem}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.45}
    .status{font-size:.95rem;color:var(--muted);margin-top:8px}
    .status.ok{color:var(--green)}.status.err{color:var(--red)}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:var(--input-bg);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:.85rem;color:var(--muted);cursor:pointer}
    .chip.active{border-color:var(--accent);color:var(--accent)}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:70vh}
    table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
    th{position:sticky;top:0;background:var(--input-bg);text-align:left;padding:10px;color:var(--muted);font-size:.75rem;text-transform:uppercase;z-index:1}
    td{padding:10px;border-top:1px solid var(--border);vertical-align:top}
    .name-cell{display:flex;align-items:center;gap:10px}
    .ico{width:48px;height:48px;object-fit:contain;border-radius:6px;background:#0a0c10}
    .empty-cell{text-align:center;padding:24px}
    .plate-dialog{width:min(560px,94vw);max-height:80vh;padding:18px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px}
    .plate-dialog::backdrop{background:rgba(0,0,0,.65)}
    .plate-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .plate-dialog-head h2{margin:0;font-size:1.05rem}
    .plate-option{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
    .plate-icon{width:42px;height:42px;object-fit:contain;border-radius:6px;background:var(--input-bg)}
    .name{font-weight:600}.meta{font-size:.82rem;color:var(--muted)}
    .score{font-weight:800;color:var(--accent)}
    .tag{display:inline-block;font-size:.7rem;padding:2px 6px;border-radius:4px;margin:1px;background:rgba(255,255,255,.06);color:var(--muted)}
    .tag.good{background:rgba(61,214,140,.15);color:var(--green)}
    .tag.bad{background:rgba(240,113,120,.15);color:var(--red)}
    .combo{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
    .combo h3{font-size:1rem;margin-bottom:6px;color:var(--accent)}
    .copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer}
    .hint{font-size:.88rem;color:var(--muted);margin-top:10px}
    .skill-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
    .skill-row input[type=number]{width:70px}
  </style>

</head>
<body>
  <div class="container">
    <h1>Бронеплиты</h1>
    <p class="sub">Класс, прочность, доступность и стоимость владения</p>
    <div class="card"><div class="row">
        <div class="field">
          <label data-i18n="tool.itemScore.gameMode">Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
<button type="button" class="btn" id="loadBtn" data-i18n="tool.itemScore.load">ЗАГРУЗИТЬ</button></div>
    <div class="row" style="margin-top:10px">
      <div class="field" style="flex:1;min-width:180px">
        <label data-i18n="tool.itemScore.search">Поиск</label>
        <input type="search" id="plateSearch" data-i18n-placeholder="tool.itemScore.searchPlaceholder" placeholder="Search plates and compatible armor">
      </div>
      <div class="field">
        <label data-i18n="tool.itemScore.minClass">Минимальный класс</label>
        <select id="plateClass"><option value="0" data-i18n="tool.itemScore.allClasses">Все классы</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        </select>
      </div>
      <label class="field" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="plateOnlyFlea"><span data-i18n="tool.itemScore.onlyFlea">Только с барахолки</span>
      </label>
    </div>
    <p class="status" id="status"></p></div>
    <div class="card"><div class="table-wrap"><table id="plateTable">
      <thead><tr>
        <th data-k="score" data-i18n="tool.itemScore.score">Рейтинг</th>
        <th data-k="name" data-i18n="tool.itemScore.name">Плита</th>
        <th data-k="cls" data-i18n="tool.itemScore.classShort">Класс</th>
        <th data-k="dur" data-i18n="tool.itemScore.durabilityShort">Прочность</th>
        <th data-k="weight" data-i18n="tool.itemScore.weight">Вес</th>
        <th data-k="repair" data-i18n="tool.plates.ui.repair">Ремонт</th>
        <th data-k="pen" data-i18n="tool.plates.ui.penalties">Штрафы</th>
        <th data-k="avg" data-i18n="tool.itemScore.flea">Барахолка</th>
        <th data-i18n="tool.plates.ui.compatibility">Броня</th><th></th></tr></thead>
      <tbody id="plateBody"></tbody>
    </table></div>
    <p class="hint" data-i18n="tool.itemScore.scoreHint"></p></div>
    <dialog id="armorDialog" class="plate-dialog">
      <div class="plate-dialog-head">
        <h2 id="armorDialogTitle"></h2>
        <button type="button" class="btn-ghost" id="armorDialogClose" data-i18n="common.close">Закрыть</button>
      </div>
      <div id="armorDialogBody"></div>
    </dialog>
  </div>

  <script src="../core/tarkov-dicts.js"></script>
  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-item-domain.js"></script>
  <script src="../core/tarkov-item-view-models.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="../js/plates.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
