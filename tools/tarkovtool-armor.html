<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Броня — рейтинг — Tarkov</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #c9a227;
      --green: #3dd68c;
      --red: #f07178;
      --input-bg: #12151b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 40px;
      line-height: 1.4;
    }
    .container { max-width: min(1600px, 92vw); margin: 0 auto; }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    select, input {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { font-size: 0.82rem; color: var(--muted); margin-top: 8px; }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(201,162,39,0.12);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 65vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--input-bg);
      text-align: left;
      padding: 8px 9px;
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      z-index: 1;
    }
    th:hover { color: var(--text); }
    td {
      padding: 8px 9px;
      border-top: 1px solid var(--border);
      vertical-align: top;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .name { font-weight: 600; }
    .meta { font-size: 0.72rem; color: var(--muted); }
    .zone-tag {
      display: inline-block;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.68rem;
      color: var(--muted);
      margin: 1px 2px 1px 0;
    }
    .ok { color: var(--green); font-weight: 600; }
    .bad { color: var(--red); font-weight: 600; }
    .empty-cell { text-align:center; padding:24px; }
    .plate-dialog { width:min(560px,94vw); max-height:80vh; padding:18px; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:12px; }
    .plate-dialog::backdrop { background:rgba(0,0,0,.65); }
    .plate-dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .plate-dialog-head h2 { margin:0; font-size:1.05rem; }
    .plate-option { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border); }
    .plate-option small { display:block; color:var(--muted); margin-top:2px; }
    .plate-icon { width:42px; height:42px; object-fit:contain; border-radius:6px; background:var(--input-bg); }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; }
    .btn-sm {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    .ico {
      width: 40px; height: 40px;
      object-fit: contain;
      background: #0a0c10;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      vertical-align: middle;
    }
    .ico-sm { width: 32px; height: 32px; }
    .name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .name-cell .txt { min-width: 0; }
</style>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"id": "tarkovtool-armor.html", "title": "Броня", "description": "Рейтинг брони по классу, зонам, плитам, без упора в цену.", "file": "tarkovtool-armor.html"}
  </script>

</head>
<body>
  <div class="container">
    <h1>Броня — максимум инфы</h1>
    <p class="sub">Класс · зоны · барахолка/торговец · квест · пластины</p>

    <div class="card">
      <div class="card-title" data-i18n="tool.armor.ui.data">Данные</div>
      <div class="row">
        <div class="field">
          <label data-i18n="tool.itemScore.gameMode">Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <button type="button" class="btn" id="loadBtn" data-i18n="tool.itemScore.load">ЗАГРУЗИТЬ</button>
      </div>
      <p class="status" id="status" data-i18n="tool.armor.ui.loadPrompt">Жми ЗАГРУЗИТЬ</p>
    </div>

    <div class="card" id="filtersCard" style="display:none;">
      <div class="card-title" data-i18n="tool.armor.ui.type">Тип</div>
      <div class="chips" id="typeChips"></div>
      <div class="card-title" style="margin-top:12px;" data-i18n="tool.itemScore.class">Класс</div>
      <div class="chips" id="classChips"></div>
      <div class="row" style="margin-top:12px;">
        <div class="field" style="flex:1;min-width:160px;">
          <label data-i18n="tool.itemScore.search">Поиск</label>
          <input type="text" id="search" data-i18n-placeholder="tool.itemScore.searchPlaceholder" placeholder="zabralo, korund, altyn…">
        </div>
        <div class="field">
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer;padding-top:18px;">
            <input type="checkbox" id="hideQuest">
            <span data-i18n="tool.itemScore.hideQuest">Скрыть за квестом</span>
          </label>
        </div>
        <div class="field">
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer;padding-top:18px;">
            <input type="checkbox" id="onlyFlea">
            <span data-i18n="tool.itemScore.onlyFlea">Только с барахолки</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card" id="tableCard" style="display:none;">
      <div class="card-title" data-i18n="tool.itemScore.name">Список</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-k="name" data-i18n="tool.itemScore.name">Название</th>
              <th data-k="class" data-i18n="tool.itemScore.classShort">Кл</th>
              <th data-k="dur" data-i18n="tool.itemScore.durabilityShort">Дур</th>
              <th data-k="kind" data-i18n="tool.armor.ui.type">Тип</th>
              <th data-i18n="tool.itemScore.zones">Зоны</th>
              <th data-k="avg" data-i18n="tool.itemScore.flea">Барахолка</th>
              <th data-k="traderPrice" data-i18n="tool.itemScore.trader">Торговец</th>
              <th data-k="quest" data-i18n="tool.itemScore.quest">Квест</th>
              <th data-k="plateSlots" data-i18n="tool.armor.ui.plates">Плиты</th>
              <th data-k="score" data-i18n="tool.itemScore.score">Рейтинг</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="hint" data-i18n="tool.armor.ui.scoreHint"></p>
    </div>
    <dialog id="plateDialog" class="plate-dialog">
      <div class="plate-dialog-head">
        <h2 id="plateDialogTitle"></h2>
        <button type="button" class="btn-ghost" id="plateDialogClose" data-i18n="common.close">Закрыть</button>
      </div>
      <div id="plateDialogBody"></div>
    </dialog>
  </div>

  <script type="module" src="../core/tarkov-dicts.js"></script>
  <script type="module" src="../core/tarkov-names.js"></script>
  <script type="module" src="../core/tarkov-storage.js"></script>
  <script type="module" src="../core/tarkov-api.js"></script>
  <script type="module" src="../core/tarkov-item-domain.js"></script>
  <script type="module" src="../core/tarkov-item-view-models.js"></script>
  <script type="module" src="../core/tarkov-ui.js"></script>
  <script type="module" src="../core/tarkov-state.js"></script>
  <script type="module" src="../core/tarkov-common.js"></script>
  <script type="module" src="../js/armor.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
