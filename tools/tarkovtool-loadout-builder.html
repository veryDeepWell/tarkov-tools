<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <title>Лоадаут-билдер — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-loadout-builder.html","title":"Лоадаут-билдер","description":"Сборка лоадаута с сохранением и загрузкой пресетов.","file":"tarkovtool-loadout-builder.html"}
  </script>
  <style>
    .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
    .slot { background:var(--input-bg); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .slot .lab { font-size:.72rem; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .slot img { width:40px; height:40px; object-fit:contain; vertical-align:middle; margin-right:8px; }
    .hits { max-height:180px; overflow:auto; margin-top:6px; }
    .hit { display:flex; gap:8px; align-items:center; padding:6px; border-radius:8px; cursor:pointer; }
    .hit:hover { background:color-mix(in srgb, var(--accent) 12%, transparent); }
    .hit img { width:28px; height:28px; }
    .presets { display:flex; flex-wrap:wrap; gap:8px; }
    .preset-chip { border:1px solid var(--border); border-radius:10px; padding:8px 12px; background:var(--card); cursor:pointer; }
    .preset-chip:hover { border-color:var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Лоадаут-билдер</h1>
    <p class="sub">Слоты → поиск предметов → сохранить / загрузить пресет (localStorage)</p>
    <div class="card">
      <div class="card-title">Пресеты</div>
      <div class="row">
        <div class="field" style="flex:1;min-width:160px">
          <label>Имя пресета</label>
          <input type="text" id="presetName" placeholder="Мой PMC #1">
        </div>
        <button type="button" class="btn" id="btnSave">Сохранить</button>
        <button type="button" class="btn-ghost" id="btnClear">Очистить слоты</button>
        <button type="button" class="btn-ghost" id="btnExport">Экспорт JSON</button>
        <button type="button" class="btn-ghost" id="btnImport">Импорт JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="presets" id="presetList" style="margin-top:10px"></div>
      <p class="status" id="status"></p>
    </div>
    <div class="card">
      <div class="card-title">Режим API</div>
      <select id="gameMode" style="max-width:180px">
        <option value="pve" selected>pve</option>
        <option value="regular">regular</option>
        <option value="pvp-season">pvp-season</option>
      </select>
    </div>
    <div class="slots" id="slots"></div>
  </div>
    
  <script src="../core/tarkov-names.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-state.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="tarkovtool-loadout-builder.js"></script>
</body>
</html>
