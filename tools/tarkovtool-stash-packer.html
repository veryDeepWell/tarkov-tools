<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уклад схрона — Tarkov Tools</title>
  <link rel="stylesheet" href="../core/tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">{"title": "Уклад схрона", "description": "Раскладка кейсов и рюкзаков на сетке схрона."}</script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1100px,94vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .card-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .field{flex:1;min-width:140px}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    select,input{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);width:100%;font-size:1rem}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.45}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
    .status{font-size:.95rem;color:var(--muted);margin-top:8px}
    .status.ok{color:var(--green)}.status.err{color:var(--red)}
    .meta{font-size:.82rem;color:var(--muted)}
    .tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:4px;margin:2px;background:rgba(255,255,255,.06);color:var(--muted)}
    a.item-link{color:var(--accent);text-decoration:none}
    a.item-link:hover{text-decoration:underline}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    th{text-align:left;padding:8px;color:var(--muted);font-size:.75rem;text-transform:uppercase;border-bottom:1px solid var(--border)}
    td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
    .link-list{list-style:none;padding:0}
    .link-list li{padding:8px 0;border-bottom:1px solid var(--border)}
    .fact-box{font-size:1.15rem;line-height:1.5;padding:16px;background:var(--input-bg);border-radius:10px;border:1px solid var(--border)}
    .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
    .case-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--input-bg)}
    .slot-map{font-family:ui-monospace,monospace;font-size:.7rem;line-height:1.2;white-space:pre;overflow:auto;max-height:200px}
</style>
</head>
<body>
  <div class="container">
    <h1>Уклад схрона</h1>
    <p class="sub">не цифровой двойник всего схрона: выбираешь кейсы/сумки, алгоритм раскладывает по сетке.</p>
    <div class="card">
      <div class="row">
        <div class="field"><label>Режим</label>
          <select id="gameMode"><option value="pve">pve</option><option value="regular">regular</option></select>
        </div>
        <button type="button" class="btn" id="loadBtn">Загрузить контейнеры</button>
      </div>
      <div class="status" id="status">Загрузи список кейсов/рюкзаков</div>
    </div>
    <div class="card">
      <div class="row">
        <div class="field" style="flex:2"><label>Контейнеры (Ctrl/⌘ — несколько)</label>
          <select id="pick" multiple size="10"></select>
        </div>
        <div class="field"><label>Кол-во каждого</label><input id="count" type="number" min="1" value="1"></div>
        <div class="field"><label>Сетка W</label><input id="cols" type="number" min="4" value="10"></div>
        <div class="field"><label>Сетка H</label><input id="rows" type="number" min="4" value="28"></div>
        <div class="field"><label>Стратегия</label>
          <select id="strategy">
            <option value="top-down">Сверху вниз</option>
            <option value="bottom-up">Снизу вверх</option>
            <option value="cases-first">Сначала кейсы</option>
            <option value="bags-first">Сначала рюкзаки</option>
          </select>
        </div>
        <button type="button" class="btn" id="packBtn">Уложить</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Карта слотов</div>
      <div class="slot-map" id="slotMap">···</div>
      <ul class="link-list" id="placedList"></ul>
    </div>
  </div>
  <script src="../core/tarkov-dicts.js"></script>
  <script src="../core/tarkov-storage.js"></script>
  <script src="../core/tarkov-schema.js"></script>
  <script src="../core/tarkov-profile.js"></script>
  <script src="../core/tarkov-nav.js"></script>
  <script src="../core/tarkov-api.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="../core/tarkov-common.js"></script>
  <script src="../js/stash-packer.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
