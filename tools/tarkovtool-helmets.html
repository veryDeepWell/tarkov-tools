<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../core/tarkov-common.css">

  <title>Шлемы — Tarkov</title>
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Шлемы", "description": "Класс, зоны, штрафы; наведение — ricochet / blunt / слоты."}
  </script>
  <style>
    .container { max-width: min(1600px, 92vw) !important; margin: 0 auto; padding: 12px 14px 64px; }
    h1 { margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field { flex: 1; min-width: 140px; }
    .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .status { font-size: .9rem; color: var(--muted); margin-top: 8px; }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .88rem; }
    th, td { padding: 9px 10px; border-top: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; background: var(--input-bg); color: var(--muted); font-size: .72rem; text-transform: uppercase; cursor: pointer; z-index: 1; }
    .name-cell { display: flex; align-items: center; gap: 10px; }
    .ico { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: var(--input-bg); }
    .meta { font-size: .75rem; color: var(--muted); }
    .name { font-weight: 600; }
    .copy-btn { min-width: auto !important; min-height: 32px !important; }
    .tip {
      display: none; position: fixed; z-index: 200; min-width: 240px; max-width: 320px;
      padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--accent);
      border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.5); font-size: .8rem; pointer-events: none;
    }
    .tip .tip-title { font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .tip .tip-grid { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; }
    .tip .k { color: var(--muted); } .tip .v { font-weight: 600; text-align: right; }
    .name-cell { cursor: help; }
    
  </style>
</head>
<body>
  <div class="container">
    <h1>Шлемы</h1>
    <p class="sub">Класс, покрытие, доступность и цена владения</p>
    
    <div class="card">
      <div class="card-title" data-i18n="tool.armor.ui.data">Данные</div>
      <div class="row">
        <div class="field"><label data-i18n="tool.itemScore.gameMode">Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <button type="button" class="btn" id="loadBtn" data-i18n="tool.itemScore.load">Загрузить</button>
      </div>
      <p class="status" id="status" data-i18n="tool.helmets.ui.loadPrompt"></p>
    </div>
    <div class="card" id="tableCard" style="display:none">
      <div class="row" style="margin-bottom:8px">
        <input type="search" id="q" data-i18n-placeholder="tool.itemScore.searchPlaceholder" placeholder="Search…" style="flex:1;min-width:180px">
        <div class="field" style="flex:0;min-width:120px"><label data-i18n="tool.itemScore.minClass">Мин. класс</label>
          <select id="minClass"><option value="0" data-i18n="tool.itemScore.allClasses">Все</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select>
        </div>
        <label class="field" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="onlyFlea"><span data-i18n="tool.itemScore.onlyFlea">Только с барахолки</span>
        </label>
        <label class="field" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="hideQuest"><span data-i18n="tool.itemScore.hideQuest">Скрыть за квестом</span>
        </label>
      </div>
      <div class="table-wrap">
        <table id="tbl">
          <thead><tr>
            <th data-k="name" data-i18n="tool.itemScore.name">Название</th>
            <th data-k="cls" data-i18n="tool.itemScore.classShort">Класс</th>
            <th data-k="dur" data-i18n="tool.itemScore.durabilityShort">Прочность</th>
            <th data-k="mat" data-i18n="tool.itemScore.material">Материал</th>
            <th data-k="zones" data-i18n="tool.itemScore.zones">Зоны</th>
            <th data-k="avg" data-i18n="tool.itemScore.flea">Барахолка</th>
            <th data-k="traderPrice" data-i18n="tool.itemScore.trader">Торговец</th>
            <th data-k="weight" data-i18n="tool.itemScore.weightSize">Вес / размер</th>
            <th data-k="score" data-i18n="tool.itemScore.score">Рейтинг</th>
            <th></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="../core/tarkov-dicts.js"></script>
  <script type="module" src="../core/tarkov-names.js"></script>
  <script type="module" src="../core/tarkov-storage.js"></script>
  <script type="module" src="../core/tarkov-api.js"></script>
  <script type="module" src="../core/tarkov-item-domain.js"></script>
  <script type="module" src="../core/tarkov-item-view-models.js"></script>
  <script type="module" src="../core/tarkov-ui.js"></script>
  <script type="module" src="../core/tarkov-state.js"></script>
  <script type="module" src="../core/tarkov-common.js"></script>
  <script type="module" src="../js/helmets.js"></script>
  <script src="../core/tarkov-tool-shell.js"></script>
</body>
</html>
