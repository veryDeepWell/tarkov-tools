<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Flip — json.tarkov.dev</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #c9a227;
      --green: #3dd68c;
      --red: #f07178;
      --input-bg: #12151b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      line-height: 1.4;
    }
    .container { max-width: min(1600px, 92vw); margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .traders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .trader-row { display: flex; flex-direction: column; gap: 4px; }
    .trader-row label { font-size: 0.8rem; color: var(--muted); }
    select, input[type="number"], input[type="text"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }
    select:focus, input:focus { border-color: var(--accent); }
    .player-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .player-row .field { min-width: 120px; }
    .player-row label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
    .status.err { color: var(--red); }
    .status.ok { color: var(--green); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .chip {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }
    .chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(201, 162, 39, 0.12);
    }
    .filter-inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }
    .filter-inputs .field { min-width: 100px; }
    .filter-inputs label {
      font-size: 0.75rem;
      color: var(--muted);
      display: block;
      margin-bottom: 3px;
    }
    .filter-inputs input { padding: 6px 8px; font-size: 0.85rem; }
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      max-height: 70vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: var(--input-bg);
      text-align: left;
      padding: 10px 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
      z-index: 1;
    }
    th:hover { color: var(--text); }
    th .sort { opacity: 0.4; margin-left: 4px; }
    th.sorted .sort { opacity: 1; color: var(--accent); }
    td {
      padding: 9px 12px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .name-cell {
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profit-pos { color: var(--green); font-weight: 600; }
    .profit-neg { color: var(--red); }
    .quest-yes { color: var(--red); }
    .quest-no { color: var(--muted); }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

    .progress-wrap {
      margin-top: 12px;
      display: none;
    }
    .progress-wrap.visible { display: block; }
    .progress-track {
      height: 8px;
      background: var(--input-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b6914, var(--accent), #e8d48b);
      border-radius: 6px;
      transition: width 0.35s ease;
    }
    .progress-bar.indeterminate {
      width: 40% !important;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }
    .progress-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }
  
    .ico {
      width: 40px; height: 40px;
      object-fit: contain;
      background: #0a0c10;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      vertical-align: middle;
    }
    .ico-sm { width: 32px; height: 32px; }
    .name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .name-cell .txt { min-width: 0; }
</style>
  <link rel="stylesheet" href="../core/tarkov-common.css">

      return (window.TarkovUI || {}).fleaTax ? TarkovUI.fleaTax(basePrice, offerPrice, count, opts) : 0;
    }
    function fleaNet(basePrice, offerPrice, count, opts) {
      return (window.TarkovUI || {}).fleaNet ? TarkovUI.fleaNet(basePrice, offerPrice, count, opts)
        : ((Number(offerPrice)||0)*(Number(count)||1) - fleaTax(basePrice, offerPrice, count, opts));
    }
    function formatNum(n) {
      return (window.TarkovUI || {}).fmtNum ? TarkovUI.fmtNum(n) : String(Math.round(Number(n)||0));
    }
    function escapeHtml(s) {
      return (window.TarkovUI || {}).esc ? TarkovUI.esc(s) : String(s||'');
    }
    function loadSettings(key, defaults) {
      return (window.TarkovUI || {}).loadSettings ? TarkovUI.loadSettings(key, defaults)
        : Object.assign({}, defaults||{});
    }
    function saveSettings(key, obj) {
      if ((window.TarkovUI || {}).saveSettings) TarkovUI.saveSettings(key, obj);
    }

  </script>

</head>
<body>
  <div class="container">
    <h1>Tarkov Flip</h1>
    <p class="sub">json.tarkov.dev · купил у торговца → продал на барахолке</p>

    <div class="card">
      <div class="card-title">Уровни лояльности торговцев</div>
      <div class="traders" id="traders"></div>
    </div>

    <div class="card">
      <div class="card-title">Игрок</div>
      <div class="player-row">
        <div class="field">
          <label>Уровень PMC</label>
          <input type="number" id="playerLevel" min="1" max="79" value="31">
        </div>
        <div class="field">
          <label>Разведцентр 3</label>
          <select id="intel3"><option value="0">Нет</option><option value="1">Да (−30%+)</option></select>
        </div>
        <div class="field">
          <label>Hideout Mgmt</label>
          <input type="number" id="hmLvl" min="0" max="50" value="0" title="0–50">
        </div>
        <div class="field">
          <label>Режим</label>
          <select id="gameMode">
            <option value="regular">regular (PVP)</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <button type="button" class="btn" id="fetchBtn">ПОЛУЧИТЬ</button>
      </div>
      <p class="status" id="status">Нажми «ПОЛУЧИТЬ» — данные с json.tarkov.dev</p>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
      <div class="card-title">Результаты</div>
      <div class="filters" id="typeFilters"></div>
      <div class="filter-inputs">
        <div class="field">
          <label>Мин. профит, ₽</label>
          <input type="number" id="minProfit" value="5000" step="1000">
        </div>
        <div class="field">
          <label>Мин. ROI, %</label>
          <input type="number" id="minRoi" value="5" step="1">
        </div>
        <div class="field">
          <label>Мин. офферов</label>
          <input type="number" id="minOffers" value="3" step="1" min="0">
        </div>
        <div class="field">
          <label>Поиск</label>
          <input type="text" id="search" placeholder="название...">
        </div>
        <div class="field" style="min-width:auto; padding-top: 18px;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" id="hideQuest" checked>
            Скрыть за квестом
          </label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="meta" id="meta"></p>
    </div>
  </div>

  <script src="../core/tarkov-common.js"></script>
  <script src="../core/tarkov-ui.js"></script>
  <script src="tarkovtool-trader-flip.js"></script>
</body>
</html>
