<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Что делать с предметом — Tarkov</title>
  <link rel="stylesheet" href="tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Что с предметом", "description": "Ввёл предмет — продажа, крафт, убежище, квесты, бартер."}
  </script>


  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1600px,92vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .card-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .field{flex:1;min-width:160px}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    select,input,textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;font-size:1rem;width:100%}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.45}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
    .status{font-size:.95rem;color:var(--muted);margin-top:8px}
    .status.ok{color:var(--green)}.status.err{color:var(--red)}
    .tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:4px;margin:2px;background:rgba(255,255,255,.06);color:var(--muted)}
    .tag.good{background:rgba(61,214,140,.15);color:var(--green)}
    .tag.bad{background:rgba(240,113,120,.15);color:var(--red)}
    .tag.quest{background:rgba(201,162,39,.2);color:var(--accent)}
    .tag.trader{background:rgba(100,160,255,.15);color:#7ec8ff}
    .name-cell{display:flex;align-items:center;gap:10px}
    .ico{width:48px;height:48px;object-fit:contain;border-radius:6px;background:#0a0c10}
    .ico-lg{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#0a0c10}
    .name{font-weight:600}.meta{font-size:.82rem;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:55vh}
    table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
    th{position:sticky;top:0;background:var(--input-bg);text-align:left;padding:10px;color:var(--muted);font-size:.75rem;text-transform:uppercase;z-index:1}
    td{padding:10px;border-top:1px solid var(--border);vertical-align:middle}
    .suggest{border:1px solid var(--border);border-radius:8px;max-height:220px;overflow:auto;background:var(--input-bg);display:none}
    .suggest div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
    .suggest div:hover{background:rgba(255,255,255,.05)}
    .hint{font-size:.88rem;color:var(--muted);margin-top:10px}
    .section{margin-bottom:14px}
    .section h3{font-size:1rem;margin-bottom:8px;color:var(--accent)}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
    .stat{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px}
    .stat .v{font-size:1.2rem;font-weight:800;color:var(--accent)}
    .stat .l{font-size:.75rem;color:var(--muted)}
    /* gun schematic */
    .schematic{
      display:grid;
      grid-template-columns: 90px 90px 120px 110px 90px 90px;
      grid-template-rows: auto auto auto auto auto;
      gap:8px;
      align-items:center;
      justify-items:center;
      padding:12px;
      overflow:auto;
    }
    .slot-box{
      width:100%; min-height:88px;
      border:1px dashed var(--border); border-radius:10px;
      background:rgba(0,0,0,.25);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:6px; text-align:center; cursor:pointer;
      position:relative;
    }
    .slot-box.has{border-style:solid;border-color:rgba(201,162,39,.45)}
    .slot-box.empty:hover{border-color:var(--accent)}
    .slot-box .slot-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .slot-box img{width:52px;height:52px;object-fit:contain}
    .slot-box .mod-name{font-size:.7rem;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .slot-box.weapon-core{border-color:var(--accent);background:rgba(201,162,39,.08);cursor:default;min-height:110px}
    .slot-box.weapon-core img{width:72px;height:72px}
    .g-muzzle{grid-column:1;grid-row:3}
    .g-barrel{grid-column:2;grid-row:3}
    .g-weapon{grid-column:3;grid-row:3}
    .g-receiver{grid-column:3;grid-row:2}
    .g-charge{grid-column:4;grid-row:2}
    .g-stock{grid-column:5;grid-row:3}
    .g-stock2{grid-column:6;grid-row:3}
    .g-scope{grid-column:3;grid-row:1}
    .g-handguard{grid-column:2;grid-row:4}
    .g-foregrip{grid-column:2;grid-row:5}
    .g-tactical{grid-column:1;grid-row:4}
    .g-mag{grid-column:3;grid-row:4}
    .g-grip{grid-column:4;grid-row:4}
    .g-other{grid-column:5 / span 2;grid-row:4 / span 2}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
    .modal-bg.show{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:720px;width:100%;max-height:80vh;overflow:auto;padding:16px}
    .modal h3{margin-bottom:10px}
    .mod-pick{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
    .mod-pick:hover{background:rgba(255,255,255,.05)}
  </style>

</head>
<body>
  <div class="container">
    <h1>Что делать с предметом?</h1>
    <p class="sub">Лампочка, болты, GPU… — куда сдать / скрафтить / вложить</p>
    <div class="card">
      <div class="row">

        <div class="field"><label>Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
        <button type="button" class="btn" id="loadBtn">ЗАГРУЗИТЬ ДАННЫЕ</button>
      </div>
      <p class="status" id="status">Нужны items + crafts + hideout + tasks</p>
    </div>
    <div class="card" id="searchCard" style="display:none">
      <div class="field">
        <label>Предмет</label>
        <input type="text" id="q" placeholder="light bulb, gpu, болт…" autocomplete="off">
        <div class="suggest" id="suggest"></div>
      </div>
      <div id="result" style="margin-top:14px"></div>
    </div>
  </div>
  <script>
    let items=[], byId={}, crafts=[], hideoutStations=[], tasks=[];
    function humanize(s){return s?String(s).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'?'}
    function formatNum(n){return n==null||Number.isNaN(n)?'—':Math.round(n).toLocaleString('ru-RU')}
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

    document.getElementById('loadBtn').onclick=async()=>{
      const st=document.getElementById('status'); st.className='status'; st.textContent='Гружу…';
      try{
        const mode=document.getElementById('gameMode').value||'pve';
        const [ji,jc,jh,jt]=await Promise.all([
          fetch('https://json.tarkov.dev/'+mode+'/items').then(r=>r.json()),
          fetch('https://json.tarkov.dev/'+mode+'/crafts').then(r=>r.json()),
          fetch('https://json.tarkov.dev/'+mode+'/hideout').then(r=>r.json()),
          fetch('https://json.tarkov.dev/'+mode+'/tasks').then(r=>r.json())
        ]);
        let raw=ji?.data?.items; items=Array.isArray(raw)?raw:Object.values(raw||{});
        byId={}; items.forEach(i=>byId[i.id]=i);
        let cr=jc?.data?.crafts??jc?.data??jc; crafts=Array.isArray(cr)?cr:Object.values(cr||{});
        let hd=jh?.data??jh; hideoutStations=Array.isArray(hd)?hd:Object.values(hd||{});
        let tk=jt?.data?.tasks??jt?.data??jt; tasks=Array.isArray(tk)?tk:Object.values(tk||{});
        st.className='status ok'; st.textContent=`items ${items.length} · crafts ${crafts.length} · stations ${hideoutStations.length} · tasks ${tasks.length}`;
        document.getElementById('searchCard').style.display='block';
      }catch(e){st.className='status err'; st.textContent=e.message}
    };

    function search(q){
      q=(q||'').toLowerCase().trim();
      if(q.length<2) return [];
      return items.filter(i=>{
        const n=(i.normalizedName||'')+' '+(i.shortName||'')+' '+(i.name||'');
        return n.toLowerCase().includes(q);
      }).slice(0,20);
    }

    function showSuggest(){
      const q=document.getElementById('q').value;
      const box=document.getElementById('suggest');
      const list=search(q);
      if(!list.length){box.style.display='none'; return}
      box.style.display='block';
      box.innerHTML=list.map(i=>`<div data-id="${esc(i.id)}">
        ${i.iconLink?`<img class="ico" src="${esc(i.iconLink)}" alt="">`:''}
        <span>${esc(humanize(i.normalizedName))}</span>
      </div>`).join('');
      box.querySelectorAll('div').forEach(d=>d.onclick=()=>{
        box.style.display='none';
        document.getElementById('q').value=humanize(byId[d.dataset.id]?.normalizedName);
        renderItem(d.dataset.id);
      });
    }
    document.getElementById('q').addEventListener('input', showSuggest);

    function renderItem(id){
      const it=byId[id]; if(!it) return;
      const el=document.getElementById('result');
      const avg=Number(it.avg24hPrice)||0;
      const sell=it.sellToTrader||[];
      const buy=it.buyFromTrader||[];
      const w=Number(it.width)||1, h=Number(it.height)||1, cells=w*h;

      // crafts that REQUIRE this item
      const asInput=crafts.filter(c=>(c.requiredItems||[]).some(r=>r.item===id));
      // crafts that PRODUCE this
      const asOutput=crafts.filter(c=>(c.productItem===id)||(c.productItem?.id===id)||(typeof c.productItem==='object'&&c.productItem?.id===id));
      // normalize product
      const prodId=c=>{
        const p=c.productItem; return typeof p==='string'?p:(p&&p.id)||null;
      };
      const asOut=crafts.filter(c=>prodId(c)===id);

      // hideout upgrades needing item
      const hideNeeds=[];
      hideoutStations.forEach(st=>{
        const levels=st.levels||st.stationLevels||[];
        (Array.isArray(levels)?levels:[]).forEach((lv,idx)=>{
          const reqs=lv.itemRequirements||lv.requirements||[];
          (reqs||[]).forEach(r=>{
            const rid=r.item||r.itemId||(typeof r==='string'?r:null);
            if(rid===id) hideNeeds.push({station:st.normalizedName||st.name||st.id, level:lv.level??idx+1, count:r.count||1});
          });
        });
        // alternate structure
        (st.levels||[]).forEach(lv=>{
          (lv.itemRequirements||[]).forEach(r=>{
            if((r.item?.id||r.item)===id) hideNeeds.push({station:humanize(st.normalizedName||st.id), level:lv.level, count:r.count||1});
          });
        });
      });

      // quests
      const quests=[];
      tasks.forEach(t=>{
        (t.objectives||[]).forEach(o=>{
          const ids=o.items||[];
          if(ids.includes(id)||(o.item&&o.item===id)){
            quests.push({name:humanize(t.normalizedName||t.name||t.id), type:o.type, count:o.count, fir:!!o.foundInRaid});
          }
        });
      });

      let html=`<div class="name-cell" style="margin-bottom:12px">
        ${it.iconLink?`<img class="ico-lg" src="${esc(it.iconLink)}" alt="">`:''}
        <div><div class="name">${esc(humanize(it.normalizedName))}</div>
        <div class="meta">${esc(it.normalizedName)} · ${w}×${h}</div></div></div>`;

      html+=`<div class="section"><h3>Продажа</h3>`;
      html+=`<p>Flea avg24h: <b>${avg?formatNum(avg)+' ₽': 'нет'}</b> · за слот: <b>${avg?formatNum(avg/cells)+' ₽': '—'}</b></p>`;
      if(sell.length){
        sell.forEach(s=>{
          const price=s.price||s.currencyPrice||0;
          const tr=s.trader?.name||s.trader?.normalizedName||s.trader||'?';
          html+=`<span class="tag trader">${esc(typeof tr==='string'?tr:humanize(tr))} ${formatNum(price)}</span> `;
        });
      } else html+=`<span class="tag">торговцам не сдаётся / нет данных</span>`;
      html+=`</div>`;

      if(buy.length){
        html+=`<div class="section"><h3>Купить у торговца</h3>`;
        buy.forEach(b=>{
          const price=b.price||0;
          const tr=b.trader?.name||b.trader?.normalizedName||'?';
          const ll=b.loyaltyLevel||b.minTraderLevel||'';
          html+=`<span class="tag trader">${esc(typeof tr==='string'?tr:humanize(String(tr)))} LL${ll} · ${formatNum(price)}</span> `;
        });
        html+=`</div>`;
      }

      html+=`<div class="section"><h3>Крафт (как ингредиент) · ${asInput.length}</h3>`;
      if(!asInput.length) html+=`<span class="meta">Не используется в крафтах</span>`;
      asInput.slice(0,30).forEach(c=>{
        const pid=prodId(c); const prod=byId[pid];
        const st=c.station?.name||c.station?.normalizedName||c.station||'';
        html+=`<div class="meta">→ ${esc(humanize(prod?.normalizedName||pid||'?'))} <span class="tag">${esc(typeof st==='string'?humanize(String(st)): '?')} Lv${c.level||''}</span></div>`;
      });
      html+=`</div>`;

      html+=`<div class="section"><h3>Крафт (на выходе) · ${asOut.length}</h3>`;
      if(!asOut.length) html+=`<span class="meta">Не крафтится</span>`;
      asOut.forEach(c=>{
        html+=`<div class="meta">станция Lv${c.level||'?'} · ${(c.requiredItems||[]).length} ингр.</div>`;
      });
      html+=`</div>`;

      html+=`<div class="section"><h3>Убежище · ${hideNeeds.length}</h3>`;
      if(!hideNeeds.length) html+=`<span class="meta">Нет в апгрейдах (или API без itemRequirements)</span>`;
      const seen=new Set();
      hideNeeds.forEach(h=>{
        const k=h.station+'|'+h.level;
        if(seen.has(k)) return; seen.add(k);
        html+=`<div class="meta">${esc(String(h.station))} → ур. ${h.level} ×${h.count}</div>`;
      });
      html+=`</div>`;

      html+=`<div class="section"><h3>Квесты · ${quests.length}</h3>`;
      if(!quests.length) html+=`<span class="meta">Не найден в задачах</span>`;
      quests.slice(0,40).forEach(q=>{
        html+=`<div><span class="tag quest">${esc(q.name)}</span> ${esc(q.type)} ×${q.count||1} ${q.fir?'<span class="tag bad">FIR</span>':''}</div>`;
      });
      html+=`</div>`;

      el.innerHTML=html;
    }
  </script>

<script>
(function(){
  const KEY='tarkovPreferredGameMode';
  const def=localStorage.getItem(KEY)||'pve';
  document.querySelectorAll('select#gameMode').forEach(sel=>{
    if([...sel.options].some(o=>o.value===def)) sel.value=def;
    sel.addEventListener('change',()=>{try{localStorage.setItem(KEY,sel.value)}catch(e){}});
  });
})();
</script>

</body>
</html>
