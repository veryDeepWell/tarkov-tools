<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стимуляторы — Tarkov</title>
  <link rel="stylesheet" href="tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"id": "tarkovtool-stims.html", "title": "Стимуляторы", "description": "Рейтинг инъекторов: бой, выносливость, отхил, вес. Эффекты из API.", "file": "tarkovtool-stims.html"}
  </script>


  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:20px 14px 48px}
    .container{max-width:min(1600px,92vw);margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
    .card-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;font-weight:600}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    select,input{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);outline:none;font-size:1rem}
    .btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
    .btn:disabled{opacity:.45}
    .status{font-size:.95rem;color:var(--muted);margin-top:8px}
    .status.ok{color:var(--green)}.status.err{color:var(--red)}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:var(--input-bg);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:.85rem;color:var(--muted);cursor:pointer}
    .chip.active{border-color:var(--accent);color:var(--accent)}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:70vh}
    table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
    th{position:sticky;top:0;background:var(--input-bg);text-align:left;padding:10px;color:var(--muted);font-size:.75rem;text-transform:uppercase;z-index:1}
    td{padding:10px;border-top:1px solid var(--border);vertical-align:top}
    .name-cell{display:flex;align-items:center;gap:10px}
    .ico{width:48px;height:48px;object-fit:contain;border-radius:6px;background:#0a0c10}
    .name{font-weight:600}.meta{font-size:.82rem;color:var(--muted)}
    .score{font-weight:800;color:var(--accent)}
    .tag{display:inline-block;font-size:.7rem;padding:2px 6px;border-radius:4px;margin:1px;background:rgba(255,255,255,.06);color:var(--muted)}
    .tag.good{background:rgba(61,214,140,.15);color:var(--green)}
    .tag.bad{background:rgba(240,113,120,.15);color:var(--red)}
    .combo{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
    .combo h3{font-size:1rem;margin-bottom:6px;color:var(--accent)}
    .copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer}
    .hint{font-size:.88rem;color:var(--muted);margin-top:10px}
    .skill-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
    .skill-row input[type=number]{width:70px}
  </style>

</head>
<body>
  <div class="container">
    <h1>Стимуляторы</h1>
    <p class="sub">Score по баффам/дебаффам · фильтр по роли</p>
    <div class="card"><div class="row">
        <div class="field">
          <label>Режим</label>
          <select id="gameMode">
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
            <option value="pve" selected>pve</option>
          </select>
        </div>
<button type="button" class="btn" id="loadBtn">ЗАГРУЗИТЬ</button></div>
    <p class="status" id="status"></p></div>
    <div class="card">
      <div class="chips" id="stimCats">
        <span class="chip active" data-v="all">Все</span>
        <span class="chip" data-v="combat">Бой</span>
        <span class="chip" data-v="stamina">Выносливость</span>
        <span class="chip" data-v="heal">Отхил</span>
        <span class="chip" data-v="weight">Вес</span>
        <span class="chip" data-v="utility">Утилита</span>
      </div>
      <div class="table-wrap" style="margin-top:12px">
        <table><thead><tr><th>Score</th><th>Предмет</th><th>Роль</th><th>Эффекты</th><th>Минусы</th><th>Flea</th><th></th></tr></thead>
        <tbody id="stimBody"></tbody></table>
      </div>
    </div>
  </div>
  <script>
    let stims=[], stimCat='all';
    function humanize(s){return s?String(s).replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()):'?'}
    function formatNum(n){return n==null||Number.isNaN(n)?'—':Math.round(n).toLocaleString('ru-RU')}
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function effectTags(effects){
      const good=[],bad=[];
      (effects||[]).forEach(e=>{
        const t=e.type||'', skill=e.skill||'', val=e.value, dur=e.duration;
        let label=skill?(skill+(val?(' '+(val>0?'+':'')+val):'')):t;
        if(t==='HealthRate'&&val>0) label='HP +'+val+'/s';
        if(t==='StaminaRate'&&val>0) label='Stam regen +'+val;
        if(t==='MaxStamina'&&val>0) label='Max stam +'+val;
        if(t==='WeightLimit') label='Weight +'+val;
        if(t==='EnergyRate'&&val<0){bad.push('Energy '+val+'/s');return}
        if(t==='HydrationRate'&&val<0){bad.push('Hydro '+val+'/s');return}
        if(t==='HealthRate'&&val<0){bad.push('HP '+val+'/s');return}
        if(t==='HandsTremor'||t==='QuantumTunnelling'){bad.push(t);return}
        if(t==='Removeallbloodlosses') label='Стоп кровь';
        if(t==='Antidote') label='Антидот';
        good.push(label+(dur?(' ('+dur+'s)'):''));
      });
      return {good,bad};
    }
    function stimRole(slug,effects){
      const types=(effects||[]).map(e=>e.type+(e.skill||'')).join(' ');
      if(/mule/.test(slug)||types.includes('WeightLimit')) return 'weight';
      if(/propital|etg|pnb|zagustin|ahf1|perfotoran/.test(slug)) return 'heal';
      if(/sj6|trimadol|meldonin/.test(slug)||/MaxStamina|StaminaRate|Endurance/.test(types)) return 'stamina';
      if(/sj1|sj9|sj12|obdolbos|strength|3-b-tg|2a2|l1|adrenaline/.test(slug+types)) return 'combat';
      return 'utility';
    }
    function stimScore(effects,avg){
      let sc=0;
      (effects||[]).forEach(e=>{
        const t=e.type,v=Number(e.value)||0,d=Number(e.duration)||0;
        if(t==='Skill'&&v>0) sc+=v*Math.min(d,400)/50;
        if(t==='HealthRate'&&v>0) sc+=v*d*0.8;
        if(t==='MaxStamina'&&v>0) sc+=v*2;
        if(t==='StaminaRate'&&v>0) sc+=v*d/10;
        if(t==='WeightLimit'&&v>0) sc+=v*8;
        if(t==='Removeallbloodlosses') sc+=40;
        if(t==='Antidote') sc+=25;
        if(t==='EnergyRate'&&v<0) sc-=Math.abs(v)*d/20;
        if(t==='HydrationRate'&&v<0) sc-=Math.abs(v)*d/20;
        if(t==='HealthRate'&&v<0) sc-=Math.abs(v)*d;
        if(t==='HandsTremor') sc-=5;
      });
      if(avg>0) sc-=Math.log10(avg+10);
      return Math.round(sc*10)/10;
    }
    document.getElementById('loadBtn').onclick=async()=>{
      const btn=document.getElementById('loadBtn'), status=document.getElementById('status');
      btn.disabled=true; status.className='status'; status.textContent='Гружу…';
      try{
        const mode=document.getElementById('gameMode').value||'pve';
        const res=await fetch('https://json.tarkov.dev/'+mode+'/items',{cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const json=await res.json();
        let items=json?.data?.items; if(!items) throw new Error('Нет items');
        if(!Array.isArray(items)) items=Object.values(items);
        stims=[];
        items.forEach(it=>{
          const p=it.properties||{};
          if(p.propertiesType!=='ItemPropertiesStim') return;
          const slug=it.normalizedName||'';
          const effects=p.stimEffects||[];
          const avg=Number(it.avg24hPrice)||0;
          stims.push({slug,name:humanize(slug),icon:it.iconLink||it.gridImageLink||'',avg,role:stimRole(slug,effects),tags:effectTags(effects),score:stimScore(effects,avg)});
        });
        stims.sort((a,b)=>b.score-a.score);
        status.className='status ok'; status.textContent='Стимов: '+stims.length;
        try{localStorage.setItem('tarkovtool-stims-settings',JSON.stringify({mode}));}catch(e){}
        render();
      }catch(e){status.className='status err'; status.textContent='Ошибка: '+e.message}
      finally{btn.disabled=false}
    };
    function render(){
      const body=document.getElementById('stimBody'); body.innerHTML='';
      stims.filter(s=>stimCat==='all'||s.role===stimCat).forEach(s=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td class="score">${s.score}</td>
          <td><div class="name-cell">${s.icon?`<img class="ico" src="${esc(s.icon)}" loading="lazy" alt="">`:''}<div><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.slug)}</div></div></div></td>
          <td><span class="tag">${esc(s.role)}</span></td>
          <td>${s.tags.good.map(t=>`<span class="tag good">${esc(t)}</span>`).join(' ')||'—'}</td>
          <td>${s.tags.bad.map(t=>`<span class="tag bad">${esc(t)}</span>`).join(' ')||'—'}</td>
          <td>${s.avg?formatNum(s.avg):'—'}</td>
          <td><button type="button" class="copy-btn" data-n="${esc(s.slug)}">копир.</button></td>`;
        body.appendChild(tr);
      });
      body.querySelectorAll('.copy-btn').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.n||''));
    }
    document.getElementById('stimCats').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      stimCat=c.dataset.v;
      document.querySelectorAll('#stimCats .chip').forEach(x=>x.classList.toggle('active',x===c));
      render();
    };
</script>

<script>
(function(){
  const KEY = 'tarkovPreferredGameMode';
  const def = localStorage.getItem(KEY) || 'pve';
  document.querySelectorAll('select#gameMode').forEach(sel => {
    if ([...sel.options].some(o => o.value === def)) sel.value = def;
    sel.addEventListener('change', () => { try { localStorage.setItem(KEY, sel.value); } catch(e) {} });
  });
})();
</script>

</body>
</html>
