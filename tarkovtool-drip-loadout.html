<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="tarkov-common.css">
  <title>Дрип-лоадаут — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-drip-loadout.html","title":"Дрип-лоадаут","description":"Случайный лук по стилю и цвету: дикий, профи, лесное чучело…","file":"tarkovtool-drip-loadout.html"}
  </script>
  <style>
    .styles { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .style-chip { border:1px solid var(--border); background:var(--input-bg); border-radius:12px; padding:10px 14px; cursor:pointer; color:var(--text); text-align:left; min-width:140px; }
    .style-chip.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .style-chip .t { font-weight:700; }
    .style-chip .d { font-size:.78rem; color:var(--muted); margin-top:2px; }
    .slot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
    .slot-card { background:var(--input-bg); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .slot-card .lab { font-size:.72rem; text-transform:uppercase; color:var(--muted); }
    .slot-card img { width:48px; height:48px; object-fit:contain; margin-top:6px; }
    .slot-card .nm { font-weight:700; margin-top:6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Дрип-лоадаут</h1>
    <p class="sub">Стиль + цвет фона предмета → случайный комплект «по вайбу»</p>
    <div class="card">
      <div class="card-title">Стиль</div>
      <div class="styles" id="styles"></div>
      <div class="row">
        <div class="field" style="max-width:160px">
          <label>Режим</label>
          <select id="gameMode">
            <option value="pve" selected>pve</option>
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
          </select>
        </div>
        <button type="button" class="btn" id="btnGo">Собрать лук</button>
      </div>
      <p class="status" id="status">Выбери стиль и жми «Собрать»</p>
    </div>
    <div class="slot-grid" id="slots"></div>
  </div>
  <script src="tarkov-common.js"></script>
  <script>
  (function () {
    var STYLES = [
      { id:'wild', title:'Дикий хуебес', desc:'чёрный / красный / олив, хаос', colors:['black','red','olive','yellow'] },
      { id:'pro', title:'Профессионал', desc:'чёрный / серый, строго', colors:['black','grey','blue'] },
      { id:'forest', title:'Лесное чучело', desc:'олива / зелёный / коричневый', colors:['olive','green','brown','violet'] },
      { id:'snow', title:'Снежный призрак', desc:'белый / серый', colors:['white','grey'] },
      { id:'desert', title:'Песок', desc:'жёлтый / коричневый', colors:['yellow','brown','orange'] },
      { id:'raider', title:'Рейдер', desc:'чёрный / фиолет', colors:['black','violet','red'] },
      { id:'medic', title:'Полевой медик', desc:'белый / красный / синий', colors:['white','red','blue'] },
      { id:'gold', title:'Флекс', desc:'жёлтый / оранж / красный', colors:['yellow','orange','red'] }
    ];
    var styleId = 'pro';
    var pool = null;
    function esc(s){ return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/"/g,'"'); }
    function status(m,ok){ var el=document.getElementById('status'); el.className='status'+(ok===true?' ok':ok===false?' err':''); el.textContent=m; }
    function pick(arr){ if(!arr||!arr.length) return null; return arr[Math.floor(Math.random()*arr.length)]; }
    document.getElementById('styles').innerHTML = STYLES.map(function(s){
      return '<button type="button" class="style-chip'+(s.id===styleId?' active':'')+'" data-id="'+s.id+'"><div class="t">'+esc(s.title)+'</div><div class="d">'+esc(s.desc)+'</div></button>';
    }).join('');
    document.getElementById('styles').onclick = function(e){
      var b = e.target.closest('.style-chip'); if(!b) return;
      styleId = b.getAttribute('data-id');
      document.querySelectorAll('.style-chip').forEach(function(c){ c.classList.toggle('active', c===b); });
    };
    async function ensure() {
      if (pool) return pool;
      status('Гружу…');
      var mode = document.getElementById('gameMode').value || 'pve';
      var arr;
      if (window.TarkovAPI && TarkovAPI.items) arr = await TarkovAPI.items(mode);
      else {
        var res = await fetch('https://json.tarkov.dev/' + mode + '/items', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        var raw = json && json.data && (json.data.items || json.data);
        arr = Array.isArray(raw) ? raw : Object.values(raw || {});
      }
      pool = arr;
      status('Предметов: ' + arr.length, true);
      return pool;
    }
    function byColor(items, colors, pred) {
      var set = {};
      colors.forEach(function(c){ set[c]=1; });
      var matched = items.filter(function(it){
        if (!pred(it)) return false;
        var bg = (it.backgroundColor || '').toLowerCase();
        return set[bg];
      });
      return matched.length ? matched : items.filter(pred);
    }
    function isGun(it){ return (it.types||[]).includes('gun') && !(it.types||[]).includes('preset') && (it.properties||{}).propertiesType==='ItemPropertiesWeapon'; }
    function isArmor(it){ return (it.types||[]).includes('armor') || (it.properties||{}).propertiesType==='ItemPropertiesArmor'; }
    function isHelm(it){ return (it.types||[]).includes('helmet') || (it.properties||{}).propertiesType==='ItemPropertiesHelmet'; }
    function isRig(it){ return (it.types||[]).includes('rig') || (it.properties||{}).propertiesType==='ItemPropertiesChestRig'; }
    function isBack(it){ return (it.types||[]).includes('backpack') || (it.properties||{}).propertiesType==='ItemPropertiesBackpack'; }
    function card(label, it) {
      if (!it) return '<div class="slot-card"><div class="lab">'+esc(label)+'</div>—</div>';
      return '<div class="slot-card"><div class="lab">'+esc(label)+' · '+(it.backgroundColor||'?')+'</div>' +
        (it.iconLink?'<img src="'+esc(it.iconLink)+'" alt="">':'') +
        '<div class="nm">'+esc(it.shortName||it.name)+'</div>' +
        '<div class="meta">'+esc(it.name||'')+'</div></div>';
    }
    async function go() {
      var items = await ensure();
      var st = STYLES.find(function(s){ return s.id===styleId; }) || STYLES[0];
      var g = pick(byColor(items, st.colors, isGun));
      var a = pick(byColor(items, st.colors, isArmor));
      var h = pick(byColor(items, st.colors, isHelm));
      var r = pick(byColor(items, st.colors, isRig));
      var b = pick(byColor(items, st.colors, isBack));
      document.getElementById('slots').innerHTML =
        card('Оружие', g)+card('Броня', a)+card('Шлем', h)+card('Разгрузка', r)+card('Рюкзак', b);
      status(st.title + ' · цвета: ' + st.colors.join(', '), true);
    }
    document.getElementById('btnGo').onclick = function(){ go().catch(function(e){ status(String(e.message||e), false); }); };
    document.getElementById('gameMode').onchange = function(){ pool = null; };
  })();
  </script>
</body>
</html>
