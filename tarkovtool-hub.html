<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarkov Tools</title>
  <link rel="preload" href="core/tarkov-common.css?v=10" as="style" />
  <link rel="stylesheet" href="core/tarkov-common.css?v=10" />
  <link rel="stylesheet" href="core/tarkov-ui.css?v=2" />
  <link rel="stylesheet" href="core/tarkov-sort.css" />
  <link rel="stylesheet" href="core/tarkov-i18n.css" />
</head>
<body>
  <div class="tt-bar">
    <strong>Tarkov Tools</strong>
    <span class="spacer"></span>
    <button type="button" class="btn-ghost" id="tt-open-settings">Настройки</button>
    <a class="btn-ghost" href="https://github.com/veryDeepWell/tarkov-tools" target="_blank" rel="noopener">GitHub</a>
  </div>

  <div class="hub-shell">
    <div id="miniBar" class="mini-bar" hidden>
      <div class="mini-label">МИНИ</div>
      <div id="miniList" class="mini-list"></div>
    </div>
    <div id="miniTip" class="mini-tip" style="display:none"></div>

    <div class="hub-work">
      <div id="hubMain" class="hub-main">
        <div class="hub-head">
          <div>
            <h1 data-i18n="hub.title">Tarkov Tools</h1>
            <p class="sub" data-i18n="hub.sub">Набор утилит для Escape from Tarkov</p>
          </div>
          <div class="hub-search">
            <input id="q" type="search" placeholder="Поиск инструментов…" data-i18n-placeholder="hub.search" autocomplete="off" />
            <span id="count" class="meta"></span>
          </div>
        </div>

        <div id="cats"></div>
        <div id="grid" class="tool-grid"></div>
        <div id="changelog" class="changelog card"></div>
      </div>

      <div id="hubExpand" class="hub-expand" aria-hidden="true">
        <div class="expand-toolbar">
          <button type="button" class="btn-ghost" id="btnCollapse">← Назад</button>
          <strong id="expandTitle"></strong>
          <span class="spacer"></span>
          <button type="button" class="btn-ghost" id="btnCloseExpand">Закрыть</button>
        </div>
        <div id="expandHost" class="expand-host"></div>
      </div>
    </div>
  </div>

  <div id="framePool" class="frame-pool" aria-hidden="true"></div>
  <div id="notifBell" class="notif-bell" title="Уведомления" hidden>🔔<span id="notifCount" class="notif-count">0</span></div>
  <div id="notifPanel" class="notif-panel" hidden>
    <div class="notif-head">
      <strong>Уведомления</strong>
      <button type="button" class="btn-ghost" id="notifClear">Очистить</button>
    </div>
    <div id="notifList" class="notif-list"></div>
  </div>

  <script defer src="core/tarkov-state.js"></script>
  <script defer src="core/tarkov-tool-kind.js"></script>
  <script defer src="core/tarkov-names.js"></script>
  <script defer src="core/tarkov-api.js"></script>
  <script defer src="core/tarkov-poll.js"></script>
  <script defer src="core/tarkov-i18n.js"></script>
  <script defer src="core/tarkov-common.js"></script>
  <script defer src="core/tarkov-i18n-bridge.js"></script>
  <script defer src="core/tarkov-icons.js"></script>
  <script defer src="hub/catalog-data.js?v=2"></script>
  <script defer src="hub/tarkov-hub-catalog.js?v=4"></script>
  <script defer src="hub/tarkov-hub-app.js"></script>
  <script defer src="hub/tarkov-hub-cats.js?v=8"></script>
  <script defer src="hub/tarkov-settings-tabs.js"></script>
  <script defer src="hub/tarkov-hub-notif.js"></script>
  <script defer src="core/tarkov-chrome-fix.js"></script>
</body>
</html>
