<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Tools</title>
  <link rel="stylesheet" href="tarkov-common.css?v=4">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Хаб", "description": "Все инструменты Tarkov в одном месте."}
  </script>
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .tool {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; min-height: 120px; transition: border-color .15s, transform .12s;
      position: relative;
    }
    .tool:hover { border-color: var(--accent); transform: translateY(-1px); }
    .tool-head { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
    .tool-ico {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .tool h2 { font-size: 1.05rem; margin: 0 0 6px; color: var(--accent); }
    .tool-pin {
      position: absolute; top: 10px; right: 10px;
      width: 36px; height: 36px; min-width: 36px !important; min-height: 36px !important;
      border-radius: 8px !important; padding: 0 !important;
      background: transparent !important; border: 1px solid var(--border) !important;
      color: var(--muted) !important; font-size: 1.1rem !important; cursor: pointer;
      display: flex !important; align-items: center; justify-content: center;
    }
    .tool-pin:hover, .tool-pin.on {
      border-color: var(--accent) !important; color: var(--accent) !important;
      background: color-mix(in srgb, var(--accent) 12%, transparent) !important;
    }
    .pins-label {
      font-size: .78rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin: 4px 0 8px; font-weight: 600;
    }
    .tool p { font-size: .9rem; color: var(--muted); margin: 0; line-height: 1.4; }
    body { padding: 0 !important; }
    .container { max-width: none !important; padding: 0 !important; margin: 0 !important; }
  </style>
</head>
<body>
  <div class="hub-shell">
    <div style="padding:12px 14px 0">
      <div class="hub-top-row">
        <h1 style="margin:0">Tarkov Tools</h1>
        <button type="button" class="btn-ghost" id="btnNotif" title="Уведомления">🔔 <span id="notifCount">0</span></button>
      </div>

      <div class="mini-bar" id="miniBar" hidden>
        <div class="mini-bar-label">Мини</div>
        <div class="mini-bar-list" id="miniList"></div>
      </div>

      <div class="hub-work" id="hubWork">
        <div class="hub-main" id="hubMain">
          <div class="card" style="margin-top:0">
            <div class="row"><input type="search" id="q" placeholder="Поиск…" autocomplete="off"></div>
            <p class="meta" id="count" style="margin-top:8px"></p>
          </div>
          <div class="grid" id="grid"></div>
          <div class="changelog" id="changelog"></div>
        </div>

        <div class="hub-expand" id="hubExpand">
          <div class="hub-expand-bar">
            <span class="title" id="expandTitle">—</span>
            <button type="button" class="btn-ghost" id="btnCollapse">Свернуть</button>
            <button type="button" class="btn-ghost" id="btnCloseExpand">Закрыть</button>
          </div>
          <div id="expandHost" style="flex:1;min-height:0;position:relative"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hub-frames" id="framePool" aria-hidden="true"></div>
  <div class="mini-tip" id="miniTip"></div>
  <div class="modal-bg" id="notifPanelBg">
    <div class="modal" id="notifPanel" style="max-width:520px">
      <div class="row" style="align-items:center;margin-bottom:12px">
        <h2 style="margin:0;flex:1">Уведомления</h2>
        <button type="button" class="btn-ghost" id="notifMarkAll">Прочитать все</button>
        <button type="button" class="btn-ghost" id="notifClose">Закрыть</button>
      </div>
      <div id="notifList" class="meta">Пусто</div>
    </div>
  </div>

  <script src="tarkov-state.js"></script>
  <script src="tarkov-names.js"></script>
  <script src="tarkov-api.js"></script>
  <script src="tarkov-common.js"></script>
  <script src="tarkov-icons.js"></script>
  <script src="tarkov-hub-app.js"></script>
  <script src="tarkov-hub-cats.js?v=4"></script>
  <script src="tarkov-settings-tabs.js"></script>
  <script src="tarkov-hub-notif.js"></script>
</body>
</html>
