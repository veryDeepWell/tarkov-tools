<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Tools</title>
  <link rel="stylesheet" href="tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Хаб", "description": "Все инструменты Tarkov в одном месте."}
  </script>
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .tool {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; min-height: 120px; transition: border-color .15s, transform .12s;
    }
    .tool:hover { border-color: var(--accent); transform: translateY(-1px); }
    .tool-head { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
    .tool-ico {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px;
      background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.25);
      display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
    }
    .tool h2 { font-size: 1.05rem; margin: 0 0 6px; color: var(--accent); }
    .tool-pin {
      position: absolute; top: 10px; right: 10px;
      width: 36px; height: 36px; min-width: 36px !important; min-height: 36px !important;
      border-radius: 8px !important; padding: 0 !important;
      background: transparent !important; border: 1px solid var(--border) !important;
      color: var(--muted) !important; font-size: 1.1rem !important; cursor: pointer;
      display: flex !important; align-items: center; justify-content: center;
    }
    .tool-pin:hover, .tool-pin.on {
      border-color: var(--accent) !important; color: var(--accent) !important;
      background: rgba(201,162,39,.12) !important;
    }
    .tool { position: relative; }
    .pins-label {
      font-size: .78rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin: 4px 0 8px; font-weight: 600;
    }
    .tool p { font-size: .9rem; color: var(--muted); margin: 0; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tarkov Tools</h1>
    <div class="card" style="margin-top:12px">
      <div class="row"><input type="search" id="q" placeholder="Поиск…" autocomplete="off"></div>
      <p class="meta" id="count" style="margin-top:8px"></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="changelog" id="changelog"></div>
  </div>
  <script src="tarkov-common.js"></script>
  <script>
    const CATALOG = [
    {"file": "tarkovtool-price-track.html", "title": "Динамика цен", "description": "Фон: снимки flea, графики истории по предмету."},
    {"file": "tarkovtool-nvg.html", "title": "ПНВ", "description": "Intensity, noise, diffuse, score картинки."},
    {"file": "tarkovtool-helmets.html", "title": "Шлемы", "description": "Класс, зоны, штрафы; ricochet/blunt по наведению."},{"file": "tarkovtool-ammo.html", "title": "Патроны", "description": "Таблица пробития по калибрам, класс брони, урон, цена."}, {"file": "tarkovtool-armor.html", "title": "Броня", "description": "Рейтинг брони по классу, зонам, плитам, без упора в цену."}, {"file": "tarkovtool-barter-calc.html", "title": "Бартер (ручной)", "description": "Калькулятор выгодности бартера: компоненты, комиссия flea."}, {"file": "tarkovtool-barter-live.html", "title": "Бартер (live)", "description": "Бартер с ценами барахолки через API, пресеты трейдов."}, {"file": "tarkovtool-bosses.html", "title": "Боссы и гуны", "description": "Шансы боссов, таймеры карт, текущая локация гунов."}, {"file": "tarkovtool-btc-farm.html", "title": "Биткоин-ферма", "description": "ROI майнинга: GPU, топливо, солнечная, Hideout Management, графики."}, {"file": "tarkovtool-compare.html", "title": "Сравнение", "description": "Сравнение нескольких предметов одной категории, моды под ствол."}, {"file": "tarkovtool-containers.html", "title": "Разгрузки и рюкзаки", "description": "Рейтинг контейнеров: слоты, вес, сегменты."}, {"file": "tarkovtool-crafts.html", "title": "Крафты убежища", "description": "ROI крафтов hideout, цены, время."}, {"file": "tarkovtool-drip.html", "title": "Дрип по цветам", "description": "Экип по цветам (песок, чёрный, MC…) + score статов."}, {"file": "tarkovtool-gun-budget.html", "title": "Сборка за N ₽", "description": "Оружие под бюджет: максимум статов, схема модов, прицел."}, {"file": "tarkovtool-gun-builder.html", "title": "Gun Builder", "description": "Сборка оружия по слотам: статы, цена, flea/торговец/квест."}, {"file": "tarkovtool-hideout-mgmt.html", "title": "Качатель Hideout Management", "description": "Какой крафт крутить на каждой станции за минимум ₽ за цикл скилла."}, {"file": "tarkovtool-hideout.html", "title": "Трекер убежища", "description": "Уровни станций, шоплист апгрейдов, цены."}, {"file": "tarkovtool-item-use.html", "title": "Что с предметом", "description": "Ввёл предмет — продажа, крафт, убежище, квесты, бартер."}, {"file": "tarkovtool-keys.html", "title": "Ключи", "description": "Ключи по локациям, цена и рейтинг."}, {"file": "tarkovtool-lang-search.html", "title": "EN ↔ RU поиск", "description": "Предметы и квесты: двойной поиск EN/RU."}, {"file": "tarkovtool-loot-slot.html", "title": "Лут ₽/слот", "description": "Цена за клетку: flea и торговец, пометка квеста."}, {"file": "tarkovtool-mags.html", "title": "Магазины", "description": "Магазины по калибрам: ёмкость, эрга, отдача."}, {"file": "tarkovtool-medkits.html", "title": "Аптечки", "description": "HP на клетку, скорость применения, ₽/HP. Аптечки и таблетки."}, {"file": "tarkovtool-mods.html", "title": "Моды", "description": "Рейтинг обвесов по статам и совместимости."}, {"file": "tarkovtool-plates.html", "title": "Плиты", "description": "Эффективность плит: класс, вес, прочность, стоимость ремонта."}, {"file": "tarkovtool-quest-items.html", "title": "Квест-предметы", "description": "FIR-предметы для квестов, трекинг."}, {"file": "tarkovtool-quests.html", "title": "Квесты · карты", "description": "Глоссарий квестов: реальные карты вместо «любая локация», цели по шагам, требования."}, {"file": "tarkovtool-raid-checklist.html", "title": "Чек-лист рейда", "description": "Сборки под карты, DnD списка, В РЕЙД → сброс галочек через 20 мин."}, {"file": "tarkovtool-restock.html", "title": "Таймер рестока", "description": "Обновление торговцев, пилик, история."}, {"file": "tarkovtool-scopes.html", "title": "Прицелы", "description": "Рейтинг оптики: кратность, ПНВ, community tier."}, {"file": "tarkovtool-shortname.html", "title": "Короткие имена", "description": "Поиск по short name + цена торговца/flea."}, {"file": "tarkovtool-skills.html", "title": "Скиллы + чизы", "description": "Трекер уровней, софт-кап усталости навыка, чиз-страты 1.0+."}, {"file": "tarkovtool-stim-combos.html", "title": "Комбо стимуляторов", "description": "Связки вроде Meldonin+SJ1, SJ6+Trimadol, Propital+MULE. Иконки и копир."}, {"file": "tarkovtool-stims.html", "title": "Стимуляторы", "description": "Рейтинг инъекторов: бой, выносливость, отхил, вес. Эффекты из API."}, {"file": "tarkovtool-streamer-flip.html", "title": "Стример-флип", "description": "Стримерские предметы vs Терапевт."}, {"file": "tarkovtool-trader-flip.html", "title": "Трейдер-флип", "description": "Перепродажа от торговца на барахолку с УЛ и квестами."}];
    const CHANGELOG = [
  {"date": "2026-09-15", "items": ["Шлемы и ПНВ", "Динамика цен flea (IndexedDB + графики)", "Скрытые статы патронов по наведению"]},{"date": "2026-09-11", "items": ["Единый дизайн: кнопки одной высоты, карточки, таблицы", "Автосортировка и поиск по всем таблицам", "Тема светлая/тёмная, RU/EN шапка, звук, импорт/экспорт", "Хаб без имён файлов + патчноут", "Биткоин-ферма с графиками"]}, {"date": "2026-09-09", "items": ["Квесты с картами, EN↔RU квесты", "Чек-лист рейда: карты + DnD", "Хаб для GitHub Pages"]}];
    const ICONS = [
      [/btc|bitcoin/i, "₿"], [/helmet/i, "🪖"], [/nvg/i, "🌑"], [/price-track/i, "📈"], [/ammo/i, "🔫"], [/armor/i, "🛡️"], [/barter/i, "🧮"],
      [/boss/i, "👹"], [/compare/i, "⚖️"], [/container/i, "🎒"], [/craft/i, "🔧"],
      [/drip/i, "🕶️"], [/gun-budget/i, "💰"], [/gun-builder/i, "🛠️"],
      [/hideout-mgmt/i, "🏠"], [/hideout/i, "🏗️"], [/key/i, "🔑"], [/lang/i, "🌐"],
      [/loot/i, "📦"], [/item-use/i, "💡"], [/mag/i, "📟"], [/medkit/i, "💊"],
      [/mods/i, "🔩"], [/plate/i, "🧱"], [/quest-item/i, "📋"], [/quest/i, "📜"],
      [/raid/i, "✅"], [/restock/i, "⏰"], [/scope/i, "🔭"], [/shortname/i, "🏷️"],
      [/skill/i, "📈"], [/stim/i, "💉"], [/streamer/i, "📺"], [/trader/i, "🏪"]
    ];
    function iconFor(file, title) {
      const hay = file + " " + title;
      for (const [re, emo] of ICONS) if (re.test(hay)) return emo;
      return "📎";
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    const PINS_KEY = 'tarkovHubPins';
    function loadPins() {
      try { return JSON.parse(localStorage.getItem(PINS_KEY) || '[]'); } catch (e) { return []; }
    }
    function savePins(pins) {
      try { localStorage.setItem(PINS_KEY, JSON.stringify(pins)); } catch (e) {}
    }
    function togglePin(file, ev) {
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      let pins = loadPins();
      if (pins.includes(file)) pins = pins.filter(f => f !== file);
      else pins.push(file);
      savePins(pins);
      if (window.TarkovTools && TarkovTools.beep) TarkovTools.beep('ok');
      render();
    }
    function displayTitle(t) {
      const en = (window.TarkovToolsTranslate && TarkovToolsTranslate.META_EN || {})[t.title];
      if (window.TarkovTools && TarkovTools.lang() === 'en' && en) return en[0];
      return t.title;
    }
    function displayDesc(t) {
      const en = (window.TarkovToolsTranslate && TarkovToolsTranslate.META_EN || {})[t.title];
      if (window.TarkovTools && TarkovTools.lang() === 'en' && en) return en[1];
      return t.description || '';
    }
    function cardHtml(t, pinned) {
      const pinTitle = (window.TarkovTools && TarkovTools.lang() === 'en')
        ? (pinned ? 'Unpin' : 'Pin')
        : (pinned ? 'Открепить' : 'Закрепить');
      return `<a class="tool" href="${esc(t.file)}">
        <button type="button" class="tool-pin ${pinned ? 'on' : ''}" data-pin="${esc(t.file)}" title="${pinTitle}">${pinned ? '📌' : '📍'}</button>
        <div class="tool-head">
          <div class="tool-ico">${iconFor(t.file, t.title)}</div>
          <div style="padding-right:28px">
            <h2>${esc(displayTitle(t))}</h2>
            <p>${esc(displayDesc(t))}</p>
          </div>
        </div>
      </a>`;
    }
    function render() {
      const q = (document.getElementById("q").value || "").toLowerCase().trim();
      const pins = loadPins();
      let list = CATALOG.slice();
      if (q) {
        list = list.filter(t => {
          const title = displayTitle(t).toLowerCase();
          const desc = displayDesc(t).toLowerCase();
          return title.includes(q) || desc.includes(q) || (t.title || '').toLowerCase().includes(q);
        });
      }
      const pinned = list.filter(t => pins.includes(t.file));
      const rest = list.filter(t => !pins.includes(t.file));
      // keep pin order as in pins array
      pinned.sort((a, b) => pins.indexOf(a.file) - pins.indexOf(b.file));

      document.getElementById("count").textContent = list.length + " / " + CATALOG.length;
      const en = window.TarkovTools && TarkovTools.lang() === 'en';
      let html = '';
      if (pinned.length) {
        html += `<div class="pins-label" style="grid-column:1/-1">${en ? 'Pinned' : 'Закреплённые'}</div>`;
        html += pinned.map(t => cardHtml(t, true)).join('');
        if (rest.length) html += `<div class="pins-label" style="grid-column:1/-1">${en ? 'All tools' : 'Все инструменты'}</div>`;
      }
      html += rest.map(t => cardHtml(t, false)).join('');
      document.getElementById("grid").innerHTML = html;
      document.querySelectorAll('.tool-pin').forEach(btn => {
        btn.onclick = (e) => togglePin(btn.getAttribute('data-pin'), e);
      });
    }
    function renderChangelog() {
      const en = window.TarkovTools && TarkovTools.lang() === 'en';
      const title = en ? 'Changelog' : 'Что изменилось';
      const itemsEn = {
        'Единый дизайн: кнопки одной высоты, карточки, таблицы': 'Unified design: equal buttons, cards, tables',
        'Автосортировка и поиск по всем таблицам': 'Auto sort and search on all tables',
        'Тема светлая/тёмная, RU/EN шапка, звук, импорт/экспорт': 'Light/dark theme, RU/EN bar, sound, import/export',
        'Хаб без имён файлов + патчноут': 'Hub without filenames + changelog',
        'Биткоин-ферма с графиками': 'Bitcoin farm with charts',
        'Квесты с картами, EN↔RU квесты': 'Quests with maps, EN↔RU quests',
        'Чек-лист рейда: карты + DnD': 'Raid checklist: maps + DnD',
        'Хаб для GitHub Pages': 'Hub for GitHub Pages',
        'Единый дизайн: кнопки, карточки, таблицы, светлая/тёмная тема': 'Unified design, light/dark theme',
        'Общие настройки, звук, импорт/экспорт, RU/EN шапка': 'Shared settings, sound, import/export',
        'Калькулятор биткоин-фермы': 'Bitcoin farm calculator',
        'Патчноут внизу хаба': 'Changelog at hub bottom',
        'Глоссарий квестов с картами по целям': 'Quest glossary with per-objective maps',
        'EN↔RU поиск: вкладка квестов': 'EN↔RU search: quests tab',
        'Чек-лист рейда: пресеты карт + drag-and-drop': 'Raid checklist: map presets + DnD',
        'Хаб под GitHub Pages': 'Hub for GitHub Pages',
        'Калькулятор биткоин-фермы с графиками': 'Bitcoin farm calculator with charts'
      };
      document.getElementById("changelog").innerHTML = "<h3>" + title + "</h3>" + CHANGELOG.map(b =>
        `<div style="margin-bottom:12px"><strong>${esc(b.date)}</strong><ul>${b.items.map(i=>`<li>${esc(en ? (itemsEn[i]||i) : i)}</li>`).join("")}</ul></div>`
      ).join("");
    }
    document.getElementById("q").addEventListener("input", render);
    render(); renderChangelog();
    const _paint = window.TarkovTools && TarkovTools._paintBar;
    // re-render hub when language toggled
    const langBtn = document.getElementById('tt-bar-lang');
    if (langBtn) {
      langBtn.addEventListener('click', () => setTimeout(() => { render(); renderChangelog(); }, 0));
    }
    document.addEventListener('click', (e) => {
      if (e.target && e.target.id === 'tt-bar-lang') setTimeout(() => { render(); renderChangelog(); }, 0);
      if (e.target && e.target.id === 'tt-apply') setTimeout(() => { render(); renderChangelog(); }, 0);
    });
  </script>
</body>
</html>
