<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarkov Tools</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="core/tarkov-common.css?v=10" as="style">
  <link rel="stylesheet" href="core/tarkov-common.css?v=10">
  <link rel="stylesheet" href="core/tarkov-ui.css?v=2">
  <link rel="stylesheet" href="core/tarkov-i18n.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Hub", "description": "All Tarkov tools in one place."}
  </script>
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    #grid.catalog-root, .catalog-root { display: block !important; }
    .catalog-root .cat-body.grid, .cat-body.grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .tool {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; min-height: 120px; transition: border-color .15s, transform .12s;
      position: relative;
    }
    .tool:hover { border-color: var(--accent); transform: translateY(-1px); }
    .tool-head { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
    .tool-ico {
      flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .tool h2 { font-size: 1rem; margin: 0 0 4px; font-weight: 700; }
    .tool p { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.35; }
    .tool-pin {
      position: absolute; top: 10px; right: 10px; border: 0; background: transparent;
      cursor: pointer; font-size: 1rem; opacity: .55; min-width: auto !important; min-height: auto !important;
      padding: 4px !important;
    }
    .tool-pin.on { opacity: 1; }
    .hub-head {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
      justify-content: space-between; margin-bottom: 16px;
    }
    .hub-search { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hub-search input { min-width: min(320px, 70vw); }
    .cat-section { margin-bottom: 22px; }
    .cat-title {
      font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin: 0 0 10px; font-weight: 700;
    }
    .pins-label {
      font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin: 8px 0 6px; font-weight: 700;
    }
    .changelog { margin-top: 28px; padding: 16px 18px; }
    .changelog h3 { margin: 0 0 10px; font-size: 1rem; }
    .changelog ul { margin: 6px 0 0 18px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="tt-bar">
    <strong>Tarkov Tools</strong>
    <span class="spacer"></span>
    <button type="button" class="btn-ghost" id="tt-open-settings">Настройки</button>
  </div>

  <div class="hub-shell">
    <div id="miniBar" class="mini-bar" hidden>
      <div class="mini-label">МИНИ</div>
      <div id="miniList" class="mini-list"></div>
    </div>
    <div id="miniTip" class="mini-tip" style="display:none"></div>

    <div class="hub-work">
      <div id="hubMain" class="hub-main">
        <div class="hub-head">
          <div>
            <h1 data-i18n="hub.title">Tarkov Tools</h1>
            <p class="sub" data-i18n="hub.sub">Набор утилит для Escape from Tarkov</p>
          </div>
          <div class="hub-search">
            <input id="q" type="search" placeholder="Поиск инструментов…" data-i18n-placeholder="hub.search" autocomplete="off" />
            <span id="count" class="meta"></span>
          </div>
        </div>

        <div id="cats"></div>
        <div id="grid" class="grid catalog-root"></div>
        <div id="changelog" class="changelog card"></div>
      </div>

      <div id="hubExpand" class="hub-expand" aria-hidden="true">
        <div class="expand-toolbar">
          <button type="button" class="btn-ghost" id="btnCollapse">← Назад</button>
          <strong id="expandTitle"></strong>
          <span class="spacer"></span>
          <button type="button" class="btn-ghost" id="btnCloseExpand">Закрыть</button>
        </div>
        <div id="expandHost" class="expand-host"></div>
      </div>
    </div>
  </div>

  <div id="framePool" class="frame-pool" aria-hidden="true"></div>
  <div id="notifBell" class="notif-bell" title="Уведомления" hidden>🔔<span id="notifCount" class="notif-count">0</span></div>
  <div id="notifPanel" class="notif-panel" hidden>
    <div class="notif-head">
      <strong>Уведомления</strong>
      <button type="button" class="btn-ghost" id="notifClear">Очистить</button>
    </div>
    <div id="notifList" class="notif-list"></div>
  </div>

  <script defer src="core/tarkov-state.js"></script>
  <script defer src="core/tarkov-tool-kind.js"></script>
  <script defer src="core/tarkov-names.js"></script>
  <script defer src="core/tarkov-api.js"></script>
  <script defer src="core/tarkov-poll.js"></script>
  <script defer src="core/tarkov-i18n.js"></script>
  <script defer src="core/tarkov-common.js"></script>
  <script defer src="core/tarkov-i18n-bridge.js"></script>
  <script defer src="core/tarkov-icons.js"></script>
  <script defer src="hub/catalog-data.js?v=2"></script>
  <script defer src="hub/tarkov-hub-catalog.js?v=4"></script>
  <script defer src="hub/tarkov-hub-app.js"></script>
  <script defer src="hub/tarkov-hub-cats.js?v=8"></script>
  <script defer src="hub/tarkov-settings-tabs.js"></script>
  <script defer src="hub/tarkov-hub-notif.js"></script>
  <script defer src="core/tarkov-chrome-fix.js"></script>
</body>
</html>
