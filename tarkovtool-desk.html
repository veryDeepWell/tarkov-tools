<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk — Tarkov Tools</title>
  <link rel="stylesheet" href="tarkov-common.css">
  <script type="application/json" id="tarkovtool-meta">
  {"title": "Desk", "description": "Мини-вкладки: несколько инструментов сразу поверх общего состояния."}
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; padding: 0 !important; }
    .desk-top {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      background: var(--card); flex-wrap: wrap;
    }
    .desk-brand { font-weight: 800; color: var(--accent); margin-right: 8px; white-space: nowrap; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); cursor: pointer;
      font-size: .85rem; max-width: 180px;
    }
    .tab.active { border-color: var(--accent); color: var(--accent); background: rgba(201,162,39,.1); }
    .tab .x { opacity: .5; font-size: .9rem; padding: 0 2px; }
    .tab .x:hover { opacity: 1; color: var(--red); }
    .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .desk-actions { display: flex; gap: 6px; align-items: center; }
    .notif-btn { position: relative; }
    .notif-btn .badge {
      position: absolute; top: -4px; right: -4px; background: var(--red); color: #fff;
      font-size: .65rem; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center;
    }
    .desk-body { flex: 1; min-height: 0; position: relative; background: var(--bg); }
    .desk-body iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: var(--bg); display: none;
    }
    .desk-body iframe.active { display: block; }
    .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); flex-direction: column; gap: 12px; padding: 24px; text-align: center;
    }
    .picker {
      display: none; position: absolute; z-index: 50; top: 48px; right: 12px;
      width: min(360px, 92vw); max-height: 60vh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4); padding: 10px;
    }
    .picker.open { display: block; }
    .picker input { width: 100%; margin-bottom: 8px; }
    .picker a {
      display: block; padding: 8px 10px; border-radius: 8px; color: var(--text);
      text-decoration: none; font-size: .9rem;
    }
    .picker a:hover { background: rgba(201,162,39,.12); }
    .notif-panel {
      display: none; position: absolute; z-index: 50; top: 48px; right: 12px;
      width: min(380px, 92vw); max-height: 55vh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4); padding: 10px;
    }
    .notif-panel.open { display: block; }
    .notif-item {
      padding: 10px; border-bottom: 1px solid var(--border); font-size: .88rem;
      cursor: pointer;
    }
    .notif-item.unread { background: rgba(201,162,39,.06); }
    .notif-item .t { font-weight: 700; color: var(--accent); }
    .notif-item .m { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="desk-top">
    <a class="desk-brand" href="tarkovtool-hub.html">Tarkov Tools</a>
    <div class="tabs" id="tabs"></div>
    <div class="desk-actions">
      <button type="button" class="btn-ghost" id="addBtn">+ вкладка</button>
      <button type="button" class="btn-ghost notif-btn" id="notifBtn" title="Уведомления">🔔<span class="badge" id="badge" style="display:none">0</span></button>
      <a class="btn-ghost" href="tarkovtool-my-tarkov.html" target="_blank" style="text-decoration:none">My Tarkov</a>
    </div>
  </div>
  <div class="desk-body" id="body">
    <div class="empty" id="empty">
      <div style="font-size:1.2rem;font-weight:700">Desk</div>
      <div>Открой несколько инструментов мини-вкладками. Каждый остаётся отдельной страницей.</div>
      <button type="button" class="btn" id="emptyAdd">Добавить вкладку</button>
    </div>
  </div>
  <div class="picker" id="picker">
    <input type="search" id="pq" placeholder="Поиск инструмента…">
    <div id="plist"></div>
  </div>
  <div class="notif-panel" id="npanel">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <strong>Уведомления</strong>
      <button type="button" class="btn-ghost" id="clearN" style="min-height:28px!important;min-width:auto!important">очистить</button>
    </div>
    <div id="nlist"></div>
  </div>

  <script src="tarkov-state.js"></script>
  <script src="tarkov-common.js"></script>
  <script>
    const CATALOG = [
      {file:'tarkovtool-my-tarkov.html', title:'My Tarkov'},
      {file:'tarkovtool-price-track.html', title:'Динамика цен'},
      {file:'tarkovtool-cultist.html', title:'Круг культистов'},
      {file:'tarkovtool-restock.html', title:'Таймер рестока'},
      {file:'tarkovtool-hideout.html', title:'Трекер убежища'},
      {file:'tarkovtool-raid-checklist.html', title:'Чек-лист рейда'},
      {file:'tarkovtool-quests.html', title:'Квесты'},
      {file:'tarkovtool-ammo.html', title:'Патроны'},
      {file:'tarkovtool-trader-flip.html', title:'Трейдер-флип'},
      {file:'tarkovtool-barter-live.html', title:'Бартер live'},
      {file:'tarkovtool-item-use.html', title:'Что с предметом'},
      {file:'tarkovtool-loot-slot.html', title:'Лут ₽/слот'},
      {file:'tarkovtool-gun-builder.html', title:'Gun Builder'},
      {file:'tarkovtool-skills.html', title:'Скиллы'},
      {file:'tarkovtool-helmets.html', title:'Шлемы'},
      {file:'tarkovtool-nvg.html', title:'ПНВ'},
      {file:'tarkovtool-hub.html', title:'Хаб'}
    ];

    let tabs = [];
    let active = null;

    function loadTabs() {
      const saved = (window.TarkovState && TarkovState.getOpenTabs()) || [];
      tabs = Array.isArray(saved) ? saved.filter(t => t && t.file) : [];
      if (tabs.length) active = tabs[0].id;
    }
    function persist() {
      if (window.TarkovState) TarkovState.setOpenTabs(tabs.map(t => ({id:t.id, file:t.file, title:t.title})));
    }
    function titleOf(file) {
      const c = CATALOG.find(x => x.file === file);
      return c ? c.title : file.replace(/^tarkovtool-/,'').replace(/\.html$/,'');
    }
    function addTab(file) {
      if (tabs.length >= 8) { alert('Макс 8 вкладок'); return; }
      const id = 't' + Date.now();
      tabs.push({id, file, title: titleOf(file)});
      active = id;
      persist();
      render();
    }
    function closeTab(id, ev) {
      if (ev) { ev.stopPropagation(); ev.preventDefault(); }
      const i = tabs.findIndex(t => t.id === id);
      if (i < 0) return;
      tabs.splice(i, 1);
      if (active === id) active = tabs[0] ? tabs[0].id : null;
      persist();
      render();
    }
    function activate(id) {
      active = id;
      render();
    }
    function render() {
      const tabsEl = document.getElementById('tabs');
      tabsEl.innerHTML = tabs.map(t =>
        `<div class="tab ${t.id===active?'active':''}" data-id="${t.id}">
          <span title="${t.title}">${t.title}</span>
          <span class="x" data-close="${t.id}">×</span>
        </div>`
      ).join('');
      tabsEl.querySelectorAll('.tab').forEach(el => {
        el.onclick = (e) => {
          if (e.target.getAttribute('data-close')) closeTab(e.target.getAttribute('data-close'), e);
          else activate(el.getAttribute('data-id'));
        };
      });

      const body = document.getElementById('body');
      const empty = document.getElementById('empty');
      body.querySelectorAll('iframe[data-id]').forEach(ifr => {
        const id = ifr.getAttribute('data-id');
        if (!tabs.find(t => t.id === id)) ifr.remove();
      });
      tabs.forEach(t => {
        let ifr = body.querySelector('iframe[data-id="'+t.id+'"]');
        if (!ifr) {
          ifr = document.createElement('iframe');
          ifr.setAttribute('data-id', t.id);
          ifr.src = t.file;
          ifr.title = t.title;
          body.appendChild(ifr);
        }
        ifr.classList.toggle('active', t.id === active);
      });
      empty.style.display = tabs.length ? 'none' : 'flex';
      renderNotifBadge();
    }

    function renderPicker() {
      const q = (document.getElementById('pq').value||'').toLowerCase();
      const list = CATALOG.filter(c => !q || c.title.toLowerCase().includes(q) || c.file.includes(q));
      document.getElementById('plist').innerHTML = list.map(c =>
        `<a href="#" data-file="${c.file}">${c.title}</a>`
      ).join('');
      document.querySelectorAll('#plist a').forEach(a => {
        a.onclick = (e) => {
          e.preventDefault();
          addTab(a.getAttribute('data-file'));
          document.getElementById('picker').classList.remove('open');
        };
      });
    }
    function renderNotifBadge() {
      const list = (window.TarkovState && TarkovState.notifications()) || [];
      const n = list.filter(x => !x.read).length;
      const b = document.getElementById('badge');
      if (n) { b.style.display='inline'; b.textContent = n; }
      else b.style.display='none';
    }
    function renderNotifs() {
      const list = (window.TarkovState && TarkovState.notifications()) || [];
      document.getElementById('nlist').innerHTML = list.length ? list.map(n =>
        `<div class="notif-item ${n.read?'':'unread'}" data-id="${n.id}">
          <div class="t">${esc(n.title||'Событие')}</div>
          <div>${esc(n.body||'')}</div>
          <div class="m">${new Date(n.ts).toLocaleString('ru-RU')}</div>
        </div>`
      ).join('') : '<div class="meta">Пусто</div>';
      document.querySelectorAll('.notif-item').forEach(el => {
        el.onclick = () => {
          if (window.TarkovState) TarkovState.markRead(el.getAttribute('data-id'));
          const n = list.find(x => x.id === el.getAttribute('data-id'));
          if (n && n.href) addTab(n.href);
          renderNotifs(); renderNotifBadge();
        };
      });
    }
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    document.getElementById('addBtn').onclick = () => {
      document.getElementById('npanel').classList.remove('open');
      document.getElementById('picker').classList.toggle('open');
      renderPicker();
    };
    document.getElementById('emptyAdd').onclick = () => document.getElementById('addBtn').click();
    document.getElementById('pq').oninput = renderPicker;
    document.getElementById('notifBtn').onclick = () => {
      document.getElementById('picker').classList.remove('open');
      document.getElementById('npanel').classList.toggle('open');
      renderNotifs();
    };
    document.getElementById('clearN').onclick = () => {
      if (window.TarkovState) TarkovState.clearNotifications();
      renderNotifs(); renderNotifBadge();
    };
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.picker') && !e.target.closest('#addBtn'))
        document.getElementById('picker').classList.remove('open');
      if (!e.target.closest('.notif-panel') && !e.target.closest('#notifBtn'))
        document.getElementById('npanel').classList.remove('open');
    });

    loadTabs();
    render();
    try {
      if (!localStorage.getItem('tarkovDeskWelcome')) {
        localStorage.setItem('tarkovDeskWelcome','1');
        if (window.TarkovState) TarkovState.notify({
          title: 'Desk готов',
          body: 'Открывай инструменты мини-вкладками. Состояние общее (localStorage).',
          href: 'tarkovtool-my-tarkov.html'
        });
      }
    } catch(e){}
  </script>
</body>
</html>
