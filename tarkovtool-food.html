<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="tarkov-common.css">
  <title>Еда и вода — Tarkov Tools</title>
  <script type="application/json" id="tarkovtool-meta">
  {"id":"tarkovtool-food.html","title":"Еда и вода","description":"Пища / вода: energy, hydration, цена, рейтинг ₽/очко.","file":"tarkovtool-food.html"}
  </script>
  <style>
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .chip { background:var(--input-bg); border:1px solid var(--border); border-radius:16px; padding:6px 14px; font-size:.85rem; color:var(--muted); cursor:pointer; }
    .chip.active { border-color:var(--accent); color:var(--accent); }
    .name-cell { display:flex; align-items:center; gap:10px; }
    .ico { width:40px; height:40px; object-fit:contain; border-radius:6px; background:var(--input-bg); }
    .score { font-weight:800; color:var(--accent); }
    th { cursor:pointer; user-select:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Еда и вода</h1>
    <p class="sub">Только provisions · energy / hydration · цена flea · рейтинг ценности</p>
    <div class="card">
      <div class="card-title">Фильтр</div>
      <div class="chips" id="kindChips">
        <button type="button" class="chip active" data-k="all">Всё</button>
        <button type="button" class="chip" data-k="food">Только пища</button>
        <button type="button" class="chip" data-k="drink">Только вода</button>
      </div>
      <div class="row">
        <div class="field" style="max-width:160px">
          <label>Режим</label>
          <select id="gameMode">
            <option value="pve" selected>pve</option>
            <option value="regular">regular</option>
            <option value="pvp-season">pvp-season</option>
          </select>
        </div>
        <div class="field" style="max-width:200px">
          <label>Поиск</label>
          <input type="search" id="q" placeholder="имя…">
        </div>
        <button type="button" class="btn" id="btnLoad">Загрузить</button>
      </div>
      <p class="status" id="status">Нажми «Загрузить»</p>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-s="name">Предмет</th>
              <th data-s="kind">Тип</th>
              <th data-s="energy">Energy</th>
              <th data-s="hydration">Hydration</th>
              <th data-s="units">Units</th>
              <th data-s="avg">Цена ₽</th>
              <th data-s="perPoint">₽/очко</th>
              <th data-s="score">Рейтинг</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="tarkov-common.js"></script>
  <script>
  (function () {
    let rows = [];
    let kind = 'all';
    let sortKey = 'score';
    let sortDir = -1;
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function status(msg, ok) {
      var el = document.getElementById('status');
      el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
      el.textContent = msg;
    }
    function scoreOf(r) {
      var pts = (r.energy || 0) + (r.hydration || 0);
      if (pts <= 0 || !r.avg) return 0;
      var per = r.avg / pts;
      var dual = (r.energy > 0 && r.hydration > 0) ? 1.15 : 1;
      var s = (10000 / Math.max(1, per)) * dual;
      if (r.units > 1) s *= 1 + Math.min(0.3, r.units / 100);
      return Math.round(s * 10) / 10;
    }
    async function load() {
      status('Загрузка…');
      var mode = document.getElementById('gameMode').value || 'pve';
      var arr;
      if (window.TarkovAPI && TarkovAPI.items) arr = await TarkovAPI.items(mode);
      else {
        var res = await fetch('https://json.tarkov.dev/' + mode + '/items', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var json = await res.json();
        var raw = json && json.data && (json.data.items || json.data);
        arr = Array.isArray(raw) ? raw : Object.values(raw || {});
      }
      rows = [];
      arr.forEach(function (it) {
        var p = it.properties || {};
        if (p.propertiesType !== 'ItemPropertiesFoodDrink') return;
        var energy = Number(p.energy) || 0;
        var hydration = Number(p.hydration) || 0;
        if (!energy && !hydration) return;
        var k = energy > 0 && hydration === 0 ? 'food'
          : hydration > 0 && energy === 0 ? 'drink' : 'both';
        var avg = Number(it.avg24hPrice) || Number(it.lastLowPrice) || 0;
        var r = {
          id: it.id,
          name: it.shortName || it.name || it.normalizedName || it.id,
          full: it.name || '',
          icon: it.iconLink || it.gridImageLink || '',
          kind: k,
          energy: energy,
          hydration: hydration,
          units: Number(p.units) || 0,
          avg: avg
        };
        r.perPoint = (energy + hydration) > 0 && avg ? Math.round(avg / (energy + hydration)) : 0;
        r.score = scoreOf(r);
        rows.push(r);
      });
      status('Найдено: ' + rows.length, true);
      render();
    }
    function render() {
      var q = (document.getElementById('q').value || '').toLowerCase();
      var list = rows.filter(function (r) {
        if (kind === 'food' && r.kind !== 'food' && r.kind !== 'both') return false;
        if (kind === 'drink' && r.kind !== 'drink' && r.kind !== 'both') return false;
        if (q && !(r.name + r.full).toLowerCase().includes(q)) return false;
        return true;
      });
      list.sort(function (a, b) {
        var av = a[sortKey], bv = b[sortKey];
        if (typeof av === 'string') return sortDir * String(av).localeCompare(String(bv), 'ru');
        return sortDir * ((av || 0) - (bv || 0));
      });
      var kindLabel = { food: 'Пища', drink: 'Вода', both: 'Оба' };
      document.getElementById('tbody').innerHTML = list.map(function (r) {
        return '<tr>' +
          '<td><div class="name-cell">' + (r.icon ? '<img class="ico" src="' + esc(r.icon) + '" alt="">' : '') +
          '<div><div class="name">' + esc(r.name) + '</div><div class="meta">' + esc(r.full) + '</div></div></div></td>' +
          '<td>' + (kindLabel[r.kind] || r.kind) + '</td>' +
          '<td>' + r.energy + '</td><td>' + r.hydration + '</td><td>' + r.units + '</td>' +
          '<td>' + (r.avg ? r.avg.toLocaleString('ru-RU') : '—') + '</td>' +
          '<td>' + (r.perPoint ? r.perPoint.toLocaleString('ru-RU') : '—') + '</td>' +
          '<td class="score">' + r.score + '</td></tr>';
      }).join('') || '<tr><td colspan="8" class="meta">Пусто</td></tr>';
    }
    document.getElementById('kindChips').onclick = function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      kind = b.getAttribute('data-k');
      document.querySelectorAll('#kindChips .chip').forEach(function (c) { c.classList.toggle('active', c === b); });
      render();
    };
    document.querySelectorAll('th[data-s]').forEach(function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-s');
        if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'name' || k === 'kind' ? 1 : -1; }
        render();
      };
    });
    document.getElementById('btnLoad').onclick = function () { load().catch(function (e) { status(String(e.message || e), false); }); };
    document.getElementById('q').oninput = render;
  })();
  </script>
</body>
</html>
